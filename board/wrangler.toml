name = "newtonia-board"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# NOTE: no [limits] cpu_ms block — a paid-plan feature; the Free plan
# rejects the deploy outright (same lesson as signal/wrangler.toml).

# Daily retention sweep (LEADERBOARD.md): demote rows below KEEP_N to
# score-only, strip blobs from stale seasons.
[triggers]
crons = ["17 4 * * *"]

# D1/R2 are created automatically on first deploy and the real database_id
# is resolved + injected over the placeholder below by
# scripts/ensure-resources.sh (deploy-board.yml). `wrangler dev --local`
# ignores the id (local sqlite/blob simulators), so the placeholder stays
# in git — do NOT paste a real id here. See README.md.
[[d1_databases]]
binding = "DB"
database_name = "newtonia-board"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder; injected at deploy

[[r2_buckets]]
binding = "REPLAYS"
bucket_name = "newtonia-replays"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "Session"

[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limiter"

# Shared platform-verification secrets (Steam / Play Games) live in a
# Cloudflare Secrets Store, so the board and signal workers reference ONE
# account-level copy instead of each holding its own per-script secret.
# The store_id is injected at deploy time from the CF_SECRETS_STORE_ID repo
# variable (scripts/ensure-resources.sh) — the placeholder below stays in
# git. read_secret() (signal/src/secret.js) reads these via the async
# .get() the store binding requires. Local dev tolerates the placeholder
# (the tests take the FAKE_VERIFY path and never read the store). One-time
# store + secret setup: board/README.md.
[[secrets_store_secrets]]
binding = "STEAM_WEBAPI_KEY"
store_id = "68f959729bdb4c3aa7793c420e740d97"
secret_name = "STEAM_WEBAPI_KEY"

[[secrets_store_secrets]]
binding = "PLAY_GAMES_OAUTH_CLIENT_ID"
store_id = "68f959729bdb4c3aa7793c420e740d97"
secret_name = "PLAY_GAMES_OAUTH_CLIENT_ID"

[[secrets_store_secrets]]
binding = "PLAY_GAMES_OAUTH_CLIENT_SECRET"
store_id = "68f959729bdb4c3aa7793c420e740d97"
secret_name = "PLAY_GAMES_OAUTH_CLIENT_SECRET"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Session", "Limiter"]

# ---- beta environment ---------------------------------------------------
# Auto-deployed by deploy-board.yml on master pushes touching board/ (and
# the shared verify modules); production stays the top-level config above.
# A named env is a SEPARATE Worker script with its own DO namespaces and
# secrets — and its own D1/R2 resources, so beta rows and blobs never mix
# with production's. Point a build at it with
#   NEWTONIA_BOARD_URL=wss://newtonia-board-beta.gfmcc.workers.dev/board
# DO bindings are NOT inherited by named envs; [[migrations]] are
# top-level-only and apply to each script on deploy.
[env.beta]
name = "newtonia-board-beta"

# TEMPORARY (2026-08-01, field-debugging the silent submit stall): widen
# the per-IP submit budget on BETA ONLY so repeated diagnostic uploads
# from one machine don't trip the 6/hour window between attempts. REMOVE
# once the stall is diagnosed — beta should normally match production's
# budgets, and SUBMIT_LIMIT must never be set on the production env.
[env.beta.vars]
SUBMIT_LIMIT = "50"

[env.beta.triggers]
crons = ["17 4 * * *"]

[[env.beta.d1_databases]]
binding = "DB"
database_name = "newtonia-board-beta"
database_id = "00000000-0000-0000-0000-000000000001" # placeholder; injected at deploy

[[env.beta.r2_buckets]]
binding = "REPLAYS"
bucket_name = "newtonia-replays-beta"

[[env.beta.durable_objects.bindings]]
name = "SESSIONS"
class_name = "Session"

[[env.beta.durable_objects.bindings]]
name = "LIMITS"
class_name = "Limiter"

# Beta binds the SAME account-level store (one set of verify credentials
# across all environments — the Steam app / Google project are the same).
[[env.beta.secrets_store_secrets]]
binding = "STEAM_WEBAPI_KEY"
store_id = "68f959729bdb4c3aa7793c420e740d97"
secret_name = "STEAM_WEBAPI_KEY"

[[env.beta.secrets_store_secrets]]
binding = "PLAY_GAMES_OAUTH_CLIENT_ID"
store_id = "68f959729bdb4c3aa7793c420e740d97"
secret_name = "PLAY_GAMES_OAUTH_CLIENT_ID"

[[env.beta.secrets_store_secrets]]
binding = "PLAY_GAMES_OAUTH_CLIENT_SECRET"
store_id = "68f959729bdb4c3aa7793c420e740d97"
secret_name = "PLAY_GAMES_OAUTH_CLIENT_SECRET"
