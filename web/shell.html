<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-03BDC6CK12"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-03BDC6CK12');
  </script>

  <title>Newtonia</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      /* Fill the whole viewport. This used to clamp the game into a 4:3 box
         (width: min(100vw, 100dvh * 4/3)) — a relic from before the engine
         resized dynamically — which pillar-boxed wide screens: on a landscape
         phone the game sat in a centred 4:3 island with dead bars either
         side. web_main.cpp sizes the drawing buffer from the canvas's real
         CSS size (x DPR) and the game/Typer handle any aspect, exactly like
         the freely-resizable native window. */
      width: 100vw;
      height: 100dvh;
    }

    canvas#canvas {
      display: block;
      /* !important so the canvas's DISPLAY size always tracks the container:
         some SDL emscripten backends write inline style.width/height on the
         canvas, and web_main.cpp's resize handler derives the drawing-buffer
         size from the canvas's CSS size — an inline override would decouple
         the two and re-open the DPR feedback that blurred/thinned the
         thick-line rendering on phones. */
      width: 100% !important;
      height: 100% !important;
      /* Crisp pixels — the game renders its own smoothing */
      image-rendering: pixelated;
    }

    /* Loading overlay */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #000;
      z-index: 10;
    }

    #loading-title {
      font-size: 2rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    #progress-bar-track {
      width: 60%;
      height: 4px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
    }

    #progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.1s linear;
    }

    #loading-status {
      font-size: 0.75rem;
      color: #666;
    }

    /* Controls bar */
    #controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0.4rem 0.6rem;
      gap: 0.5rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    #game-container:hover #controls-bar {
      opacity: 1;
      pointer-events: auto;
    }

    .ctrl-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-family: monospace;
      font-size: 0.7rem;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      border-radius: 3px;
    }

    .ctrl-btn:hover { background: rgba(255,255,255,0.25); }

    /* Touch controls overlay (visible on touch devices) */
    #touch-controls {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    @media (pointer: coarse) {
      #touch-controls { display: block; }
      /* Hover doesn't fire reliably on touch devices, so always show the controls bar */
      #controls-bar {
        opacity: 1;
        pointer-events: auto;
      }
    }

    /* Analog joystick rings — positioned in JS */
    .joy-base {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(100, 160, 255, 0.45);
      background: rgba(100, 160, 255, 0.07);
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .joy-nub {
      position: absolute;
      border-radius: 50%;
      background: rgba(160, 205, 255, 0.80);
      box-shadow: 0 0 14px rgba(100, 160, 255, 0.50);
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    /* Left joystick capture zone */
    .joy-zone {
      position: absolute;
      left: 0; top: 0;
      width: 50%; height: 100%;
      pointer-events: auto;
      touch-action: none;
    }

    /* Action buttons — right half */
    .touch-btn {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-size: 1.6rem;
      transition: background 0.06s, border-color 0.06s, transform 0.06s;
    }

    /* Full-screen tap-to-start overlay shown on the main menu */
    .menu-overlay {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: auto;
      touch-action: none;
    }

    /* Circular action buttons — sized in JS, centred via transform in CSS */
    .touch-shoot, .touch-mine, .touch-boost, .touch-pause {
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.65);
      transform: translate(-50%, -50%);
    }
    .touch-shoot {
      border: 2px solid rgba(255, 90, 90, 0.35);
      background: rgba(255, 90, 90, 0.07);
    }
    .touch-shoot.pressed {
      background: rgba(255, 90, 90, 0.28);
      border-color: rgba(255, 90, 90, 0.80);
      transform: translate(-50%, -50%) scale(0.93);
    }
    .touch-mine {
      border: 2px solid rgba(90, 150, 255, 0.35);
      background: rgba(90, 150, 255, 0.07);
    }
    .touch-mine.pressed {
      background: rgba(90, 150, 255, 0.28);
      border-color: rgba(90, 150, 255, 0.80);
      transform: translate(-50%, -50%) scale(0.93);
    }
    .touch-boost {
      border: 2px solid rgba(255, 190, 80, 0.35);
      background: rgba(255, 190, 80, 0.07);
    }
    .touch-boost.pressed {
      background: rgba(255, 190, 80, 0.28);
      border-color: rgba(255, 190, 80, 0.80);
      transform: translate(-50%, -50%) scale(0.93);
    }
    /* Ship::boost's cooldown, mirrored by window.setBoostReady */
    .touch-boost.cooldown {
      opacity: 0.35;
    }
    /* Double up-chevron ("more speed"), matching the native OSD's icon —
       pseudo-elements like the pause bars, so no font is involved */
    .touch-boost::before, .touch-boost::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 34%;
      height: 34%;
      border-top: 3px solid rgba(255, 190, 80, 0.65);
      border-left: 3px solid rgba(255, 190, 80, 0.65);
      transform: translate(-50%, 0) rotate(45deg);
    }
    /* A rotated square's chevron spans from its box-centre minus the
       half-diagonal (the apex) down to box-centre (the arm tips), so the
       tops sit lower than intuition says to centre the pair visually. */
    .touch-boost::before { top: 28%; }
    .touch-boost::after  { top: 54%; }
    .touch-pause {
      border: 2px solid rgba(255, 255, 255, 0.30);
      background: rgba(255, 255, 255, 0.05);
    }
    .touch-pause.pressed {
      background: rgba(255, 255, 255, 0.20);
      border-color: rgba(255, 255, 255, 0.70);
      transform: translate(-50%, -50%) scale(0.93);
    }
    /* Two pause bars, drawn as pseudo-elements so no font is involved */
    .touch-pause::before, .touch-pause::after {
      content: "";
      position: absolute;
      top: 32%;
      width: 12%;
      height: 36%;
      background: rgba(255, 255, 255, 0.55);
    }
    .touch-pause::before { left: 34%; }
    .touch-pause::after  { right: 34%; }

    /* Game-over promo banner (built by main.ts, shown via window.newtGameOver
       from the game's game-over latch): the run just ended — offer the site
       leaderboard ("where would this score rank?") and the Steam store, the
       two things the free web build doesn't have. Sits above the tap-to-
       continue overlay; its own links/button still receive the pointer. */
    #go-banner {
      position: absolute;
      left: 50%;
      bottom: 3.2rem;
      transform: translateX(-50%);
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      padding: 0.65rem 2.2rem 0.65rem 1rem;
      background: rgba(0, 10, 4, 0.88);
      border: 1px solid rgba(40, 255, 120, 0.45);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      max-width: 92vw;
      text-align: center;
    }
    #go-banner a { color: #2aff78; text-decoration: none; }
    #go-banner a:hover { color: #8dffb9; text-decoration: underline; }
    #go-banner a.go-steam { color: #9ec3ff; }
    #go-banner a.go-steam:hover { color: #cfe2ff; }
    #go-banner button {
      position: absolute;
      top: 0.1rem;
      right: 0.35rem;
      background: none;
      border: 0;
      color: #6a8f78;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #go-banner button:hover { color: #fff; }

    {{{ STYLE }}}
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>

    <div id="loading">
      <div id="loading-title">Newtonia</div>
      <div id="progress-bar-track">
        <div id="progress-bar-fill"></div>
      </div>
      <div id="loading-status">Loading…</div>
    </div>

    <div id="controls-bar">
      <a class="ctrl-btn" id="site-link" href="https://newtonia.metonymous.com" title="Back to site" style="text-decoration:none">&#x2190; newtonia</a>
      <button class="ctrl-btn" id="fullscreen-btn" title="Fullscreen">&#x26F6;</button>
      <button class="ctrl-btn" id="mute-btn" title="Mute">&#x1F50A;</button>
    </div>

    <div id="touch-controls"></div>
  </div>

  <script>
    // When embedded off-domain (e.g. the itch.io iframe), open the site link
    // in a new tab instead of navigating the game's iframe.
    (function() {
      if (location.hostname !== 'newtonia.metonymous.com') {
        var link = document.getElementById('site-link');
        link.target = '_blank';
        link.rel = 'noopener';
      }
    })();
  </script>

  <script>
    // Intercept AudioContext construction so we can capture the instance used
    // by SDL2/Emscripten for mute support (created lazily on first user gesture).
    (function() {
      var Orig = window.AudioContext;
      if (!Orig) return;
      function PatchedAudioContext(options) {
        var ctx = new Orig(options);
        window._newtAudioCtx = ctx;
        return ctx;
      }
      PatchedAudioContext.prototype = Orig.prototype;
      window.AudioContext = PatchedAudioContext;
    })();
  </script>

  <script>
    // Emscripten Module configuration — must be defined before the main script.
    var Module = {
      canvas: (function() {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener('webglcontextlost', function(e) {
          e.preventDefault();
        }, false);
        return canvas;
      })(),

      setStatus: function(text) {
        var el = document.getElementById('loading-status');
        if (el) el.textContent = text || 'Ready';
      },

      monitorRunDependencies: function(left) {
        // no-op
      },

      onRuntimeInitialized: function() {
        var loading = document.getElementById('loading');
        if (loading) {
          loading.style.transition = 'opacity 0.4s';
          loading.style.opacity = '0';
          setTimeout(function() { loading.style.display = 'none'; }, 400);
        }
        // Focus canvas so keyboard events work immediately
        document.getElementById('canvas').focus();
      },

      // Progress bar
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
    };

    // Progress bar wired to XHR progress events via Emscripten's fetch hooks
    window.addEventListener('load', function() {
      var fill = document.getElementById('progress-bar-fill');
      // Emscripten fires 'progress' on the Module object for --preload-file data
      var origSetStatus = Module.setStatus;
      Module.setStatus = function(text) {
        origSetStatus(text);
        var match = text.match(/(\d+)\/(\d+)/);
        if (match && fill) {
          fill.style.width = (100 * parseInt(match[1]) / parseInt(match[2])) + '%';
        } else if (!text && fill) {
          fill.style.width = '100%';
        }
      };
    });
  </script>

  {{{ SCRIPT }}}

  <script src="main.js"></script>
</body>
</html>
