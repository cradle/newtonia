plugins {
    id 'com.android.application'
}

android {
    namespace 'org.newtonia'
    compileSdk 36

    defaultConfig {
        applicationId "org.newtonia"
        minSdk 21           // Android 5.0 (GLES2 guaranteed)
        targetSdk 36        // Android 16 (Google Play target-API requirement)
        versionCode (project.findProperty('versionCode') as Integer) ?: 1
        versionName project.findProperty('versionName') ?: "0.0.1"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11"
                // SDL2 source dirs — cloned as siblings to the repo root.
                // CMakeLists.txt uses add_subdirectory to build them from source.
                arguments "-DSDL2_SOURCE_DIR=${rootDir}/../../SDL2",
                          "-DSDL2_MIXER_SOURCE_DIR=${rootDir}/../../SDL2_mixer"
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path "${rootDir}/../CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            // Game assets (sounds, etc.) are placed in android/app/src/main/assets
            assets.srcDirs = ['src/main/assets']
            // Include SDL2 Java sources directly from the SDL2 sibling directory so
            // the build works both locally and in CI without a manual copy step.
            java.srcDirs += ["${rootDir}/../../SDL2/android-project/app/src/main/java"]
        }
    }
}

dependencies {
    // Play Games Services v2 — achievements backend (PlayGamesAchievements.java;
    // native half in play_games_achievements.cpp under PLAY_GAMES_BUILD).
    implementation 'com.google.android.gms:play-services-games-v2:20.1.2'
    // Explicit floor for a transitive dep of play-services: without it the
    // resolved androidx.activity is 1.0.0, which the Play Console flags as
    // an outdated SDK on every release. Gradle resolves to the highest
    // requested version, so this one line lifts the whole tree.
    implementation 'androidx.activity:activity:1.9.3'
    // activity 1.9 brings kotlin-stdlib 1.8, which absorbed the old
    // -jdk7/-jdk8 split; play-services still pulls kotlin-stdlib-jdk8
    // 1.6 and the pair trips checkDuplicateClasses. The BOM aligns every
    // stdlib artifact to one version (the 1.8 -jdk8 artifact is an empty
    // relocation shim, so the duplicates vanish).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    // Deferred deep link (task #145): reads the Play Store install
    // referrer on first launch so a join link's room code survives the
    // store install (NewtoniaActivity.checkInstallReferrer).
    implementation 'com.android.installreferrer:installreferrer:2.2'
}
