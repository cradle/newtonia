# Required by the Play Games Services dependency (achievements backend):
# play-services-games-v2 transitively depends on AndroidX libraries, and AGP
# fails checkDebugAarMetadata unless the project opts in. No Jetifier needed —
# nothing here uses the legacy android.support libraries.
android.useAndroidX=true

# AGP 8.7.3 was tested up to compileSdk 35, so it prints an "untested
# compileSdk" warning when we build against a newer platform. We target
# Android 16 (API 36) to satisfy Google Play's target-API requirement; the
# build is unaffected, so silence the warning rather than churn the whole
# AGP/Gradle/JDK toolchain. (AGP was lifted 8.2.0 → 8.7.3 / Gradle 8.4 → 8.9
# so the uncompressed .so files are 16 KB zip-aligned; see app/build.gradle.)
android.suppressUnsupportedCompileSdk=36
