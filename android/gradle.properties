# Required by the Play Games Services dependency (achievements backend):
# play-services-games-v2 transitively depends on AndroidX libraries, and AGP
# fails checkDebugAarMetadata unless the project opts in. No Jetifier needed —
# nothing here uses the legacy android.support libraries. (AGP 9 defaults
# this to true; kept explicit so the intent survives a downgrade.)
android.useAndroidX=true

# Toolchain: AGP 9.3.2 (android/build.gradle) on Gradle 9.5.0 (the wrapper),
# JDK 17+ (android.yml / deploy-android.yml set up Temurin 17). Lifted from
# AGP 8.7.3 / Gradle 8.9 on Google Play's R8-optimisation insight ("upgrade
# your Android Gradle plugin to version 9.0 or higher"): AGP 9 carries the
# newer R8, which is what the Play Console measures the app's memory /
# performance optimisation against. AGP 9 tests up to compileSdk 36, so the
# old android.suppressUnsupportedCompileSdk=36 line is gone. AGP 9 also
# defaults android.newDsl / android.builtInKotlin to true — this module is
# plain Java on the ordinary public DSL, so neither needs an opt-out.
# (The earlier 8.2.0 → 8.7.3 lift was for 16 KB zip-alignment of the
# uncompressed .so files; see app/build.gradle.)
