name = "newtonia-signal"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# Denial-of-wallet guard: every handler here is a few JSON parses and a
# relay send — 50 ms of CPU is an order of magnitude of headroom. Bounds
# the worst-case CPU billing per invocation (the platform cap is 30 s).
[limits]
cpu_ms = 50

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Limiter"]
