name = "newtonia-signal"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# NOTE: no [limits] cpu_ms block — per-script CPU limits are a PAID-plan
# feature and the Free plan rejects the deploy outright (API error
# 100328). Free-plan workers are platform-capped at 10 ms CPU per
# invocation anyway, which is a tighter denial-of-wallet bound than the
# 50 ms this used to request. If the account moves to a paid plan,
# restore:  [limits]  cpu_ms = 50

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Limiter"]

# ---- beta environment ---------------------------------------------------
# Auto-deployed by deploy-signal.yml on master pushes touching signal/
# (production stays the top-level config above — plain `wrangler deploy`).
# A named env is a SEPARATE Worker script: its own workers.dev URL, its
# own Durable Object namespaces (never the live rooms/limits), its own
# secrets (`wrangler secret put NAME --env beta`; none are required —
# without TURN keys it just stays STUN-only). Point a build at it with
#   NEWTONIA_SIGNAL_URL=wss://newtonia-signal-beta.gfmcc.workers.dev/ws
# DO bindings are NOT inherited by named envs, so they repeat here;
# [[migrations]] are top-level-only and apply to each script on deploy.
[env.beta]
name = "newtonia-signal-beta"

[[env.beta.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.beta.durable_objects.bindings]]
name = "LIMITS"
class_name = "Limiter"
