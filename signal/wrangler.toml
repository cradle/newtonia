name = "newtonia-signal"
main = "src/worker.js"
compatibility_date = "2026-06-01"

# NOTE: no [limits] cpu_ms block — per-script CPU limits are a PAID-plan
# feature and the Free plan rejects the deploy outright (API error
# 100328). Free-plan workers are platform-capped at 10 ms CPU per
# invocation anyway, which is a tighter denial-of-wallet bound than the
# 50 ms this used to request. If the account moves to a paid plan,
# restore:  [limits]  cpu_ms = 50

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limiter"

# Shared platform-verification secrets (Steam / Play Games) — an
# account-level Cloudflare Secrets Store this worker shares with the board
# worker, so one copy serves both instead of duplicating per-script
# secrets. The store_id is injected at deploy from the CF_SECRETS_STORE_ID
# repo variable (scripts/ensure-resources.sh); the placeholder stays in git.
# read_secret() (src/secret.js) reads these via the store's async .get().
# MIGRATION: after this binding is live, delete the OLD per-worker secrets
# of the same name (`wrangler secret delete STEAM_WEBAPI_KEY`, etc.) so the
# store is the single source — see README.md. TURN and other signal-only
# secrets stay per-worker (nothing to share).
[[secrets_store_secrets]]
binding = "STEAM_WEBAPI_KEY"
store_id = "00000000000000000000000000000000"
secret_name = "STEAM_WEBAPI_KEY"

[[secrets_store_secrets]]
binding = "PLAY_GAMES_OAUTH_CLIENT_ID"
store_id = "00000000000000000000000000000000"
secret_name = "PLAY_GAMES_OAUTH_CLIENT_ID"

[[secrets_store_secrets]]
binding = "PLAY_GAMES_OAUTH_CLIENT_SECRET"
store_id = "00000000000000000000000000000000"
secret_name = "PLAY_GAMES_OAUTH_CLIENT_SECRET"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Limiter"]

# ---- beta environment ---------------------------------------------------
# Auto-deployed by deploy-signal.yml on master pushes touching signal/
# (production stays the top-level config above — plain `wrangler deploy`).
# A named env is a SEPARATE Worker script: its own workers.dev URL, its
# own Durable Object namespaces (never the live rooms/limits), its own
# secrets (`wrangler secret put NAME --env beta`; none are required —
# without TURN keys it just stays STUN-only). Point a build at it with
#   NEWTONIA_SIGNAL_URL=wss://newtonia-signal-beta.gfmcc.workers.dev/ws
# DO bindings are NOT inherited by named envs, so they repeat here;
# [[migrations]] are top-level-only and apply to each script on deploy.
[env.beta]
name = "newtonia-signal-beta"

[[env.beta.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.beta.durable_objects.bindings]]
name = "LIMITS"
class_name = "Limiter"

# Beta binds the SAME account-level store as production and the board.
[[env.beta.secrets_store_secrets]]
binding = "STEAM_WEBAPI_KEY"
store_id = "00000000000000000000000000000000"
secret_name = "STEAM_WEBAPI_KEY"

[[env.beta.secrets_store_secrets]]
binding = "PLAY_GAMES_OAUTH_CLIENT_ID"
store_id = "00000000000000000000000000000000"
secret_name = "PLAY_GAMES_OAUTH_CLIENT_ID"

[[env.beta.secrets_store_secrets]]
binding = "PLAY_GAMES_OAUTH_CLIENT_SECRET"
store_id = "00000000000000000000000000000000"
secret_name = "PLAY_GAMES_OAUTH_CLIENT_SECRET"
