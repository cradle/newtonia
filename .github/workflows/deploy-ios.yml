name: Deploy iOS (TestFlight / App Store)

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push --tags
# Or manually from the Actions tab.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      signal_worker:
        description: 'Signaling worker the build points at. beta = staging: the build is pinned to a sentinel <version>.9xx train (it cannot reach production rooms) — expire it in App Store Connect when the test is done'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - beta
      version:
        description: 'Marketing version for a manual build. MUST exceed the latest App Store version AND any in-review version (1.46.5 approved as of 2026-07-24), or App Store Connect rejects it / collides with the review. Ignored on tag builds (they use the tag).'
        required: false
        default: '1.47.0'
        type: string

jobs:
  deploy:
    runs-on: macos-26

    steps:
      - name: Select Xcode 26.3
        run: sudo xcode-select -switch /Applications/Xcode_26.3.app

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: newtonia

      # The .xcodeproj is generated from ios/project.yml (gitignored). Build
      # it before the archive step so the same globbed source set deploys.
      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          cd newtonia/ios && xcodegen generate --spec project.yml

      - name: Clone SDL2
        run: git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git SDL2

      - name: Clone SDL2_mixer
        run: |
          git clone --depth 1 --branch release-2.8.2 https://github.com/libsdl-org/SDL_mixer.git SDL2_mixer
          git -C SDL2_mixer submodule update --init --depth 1

      - name: Build SDL2 static library for iOS (arm64 device)
        run: |
          cmake -S SDL2 -B SDL2/build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_HIDAPI=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_C_FLAGS="-DGLES_SILENCE_DEPRECATION" \
            -DCMAKE_CXX_FLAGS="-DGLES_SILENCE_DEPRECATION"
          cmake --build SDL2/build-ios --config Release

      - name: Build SDL2_mixer static library for iOS (arm64 device)
        run: |
          SDL2_LIB=$(find "$(pwd)/SDL2/build-ios" -name "libSDL2.a" | head -1)
          cmake -S SDL2_mixer -B SDL2_mixer/build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DSDL_SHARED=OFF \
            -DSDL2MIXER_SHARED=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DSDL2MIXER_SAMPLES=OFF \
            -DSDL2MIXER_VORBIS="" \
            -DSDL2MIXER_WAVPACK=OFF \
            -DSDL2MIXER_FLAC=OFF \
            -DSDL2MIXER_OPUS=OFF \
            -DSDL2MIXER_MOD=OFF \
            -DSDL2MIXER_MIDI=OFF \
            -DSDL2MIXER_MP3=OFF \
            -DSDL2_LIBRARY="$SDL2_LIB" \
            -DSDL2_INCLUDE_DIR="$(pwd)/SDL2/include" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_C_FLAGS="-DGLES_SILENCE_DEPRECATION" \
            -DCMAKE_CXX_FLAGS="-DGLES_SILENCE_DEPRECATION"
          cmake --build SDL2_mixer/build-ios --config Release

      # Netplay (NETPLAY.md): MbedTLS + libdatachannel static for the arm64
      # DEVICE — the same pins and recipe ios.yml gates for the simulator on
      # every push, with iphoneos in place of iphonesimulator.
      - name: Build MbedTLS + libdatachannel for iOS (netplay)
        run: |
          UCFG="-DMBEDTLS_USER_CONFIG_FILE=\\\"$(pwd)/newtonia/xbox/mbedtls_user_config.h\\\""
          git clone --branch v3.6.6 --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/Mbed-TLS/mbedtls.git mbedtls
          cmake -S mbedtls -B mbedtls/build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DCMAKE_C_FLAGS="$UCFG" \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/netlibs
          cmake --build mbedtls/build-ios -j3
          cmake --install mbedtls/build-ios

          git clone --branch v0.24.5 --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/paullouisageneau/libdatachannel.git libdatachannel
          cmake -S libdatachannel -B libdatachannel/build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DUSE_MBEDTLS=ON -DNO_MEDIA=ON -DNO_WEBSOCKET=OFF \
            -DNO_EXAMPLES=ON -DNO_TESTS=ON \
            -DCMAKE_PREFIX_PATH=$(pwd)/netlibs \
            -DCMAKE_FIND_ROOT_PATH=$(pwd)/netlibs \
            -DCMAKE_C_FLAGS="$UCFG" -DCMAKE_CXX_FLAGS="$UCFG"
          cmake --build libdatachannel/build-ios -j3 --target datachannel-static

      # Import the Apple Distribution certificate and provisioning profile.
      # One-time setup required:
      #   1. In Apple Developer Portal, create an App ID for cc.gfm.Newtonia
      #   2. Create an App Store Distribution provisioning profile
      #   3. Export the Distribution certificate as .p12, base64-encode it:
      #        base64 -w0 Certificates.p12  → DISTRIBUTION_CERT_BASE64 secret
      #   4. base64-encode the .mobileprovision file:
      #        base64 -w0 Newtonia.mobileprovision  → PROVISIONING_PROFILE_BASE64 secret
      #   5. Create an App Store Connect API Key (see appstoreconnect.apple.com/access/api)
      #      Store as: APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
      #                APP_STORE_CONNECT_API_KEY_CONTENT
      - name: Import code signing certificate
        env:
          CERT_BASE64: ${{ secrets.DISTRIBUTION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DISTRIBUTION_CERT_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"' | xargs)
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" "$KEYCHAIN"
          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE_BASE64" | base64 -d > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_PLIST=$(security cms -D -i profile.mobileprovision)
          UUID=$(echo "$PROFILE_PLIST" | plutil -extract UUID xml1 -o - - \
            | sed -n 's|.*<string>\(.*\)</string>.*|\1|p')
          TEAM_ID=$(echo "$PROFILE_PLIST" | plutil -extract TeamIdentifier.0 xml1 -o - - \
            | sed -n 's|.*<string>\(.*\)</string>.*|\1|p')
          PROFILE_NAME=$(echo "$PROFILE_PLIST" | plutil -extract Name xml1 -o - - \
            | sed -n 's|.*<string>\(.*\)</string>.*|\1|p')
          echo "Team ID: $TEAM_ID"
          echo "Profile UUID: $UUID"
          echo "Profile Name: $PROFILE_NAME"
          cp profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          # Substitute real team ID into entitlements
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" \
            newtonia/ios/Entitlements.plist > entitlements-final.plist
          # Export for subsequent steps
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      - name: Set version numbers
        run: |
          # Tag build -> use the tag's version; manual dispatch -> use the
          # `version` input. The ref-type gate matters: a dispatch can
          # target a TAG ref (re-running a failed tag deploy from the
          # Actions tab), and the input is ALWAYS non-empty on dispatch
          # (it has a default) — without the gate the default would
          # override the tag and upload the rebuild into the wrong
          # TestFlight train, burning the reserved next version.
          TAG_VERSION="${{ github.ref_name }}"
          SHORT_VERSION="${TAG_VERSION#v}"
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ "${{ github.ref_type }}" != "tag" ] && [ -n "$INPUT_VERSION" ]; then
            SHORT_VERSION="$INPUT_VERSION"
          fi
          # Guard: must be a dotted numeric version. Fall back ABOVE the store
          # version AND any in-review version — App Store Connect rejects a
          # marketing version <= the latest approved one, closes old trains, and
          # collides with a version in review (1.46.5 approved as of
          # 2026-07-24; the old 1.0 fallback failed every dispatch build).
          if ! echo "$SHORT_VERSION" | grep -qE '^[0-9]+(\.[0-9]+){0,2}$'; then
            SHORT_VERSION="1.47.0"
          fi
          # Beta-worker builds are staging clients (hard-wired to the
          # isolated newtonia-signal-beta worker — their room codes never
          # resolve against production peers), so they must never ship as
          # (or be mistaken for) a release. They used to pin to a 0.0.N
          # train, which TestFlight never auto-updated testers onto, but
          # App Store Connect now rejects ANY upload whose marketing
          # version is below the last APPROVED version ("must contain a
          # higher version than that of the previously approved version"
          # — first hit 2026-07-24, 0.0.224 vs approved 1.46.5), so a
          # below-train version can no longer upload at all. Betas now
          # ride a sentinel patch train ABOVE the next release instead:
          # <input major.minor>.9xx (e.g. 1.47.0 -> 1.47.9xx; the 9xx
          # patch makes it unmistakable in the ASC version list, and the
          # run number keeps CFBundleVersion unique). Tradeoff: until the
          # next release ships a higher version, an internal group with
          # automatic distribution sees the beta as the newest build and
          # auto-updates onto it — EXPIRE the build in App Store Connect
          # (TestFlight -> the build -> Expire) once the test is done.
          # External groups are unaffected (builds reach them only by
          # explicit assignment). This deliberately overrides an explicit
          # `version` input's patch component too.
          if [ "${{ github.event.inputs.signal_worker }}" = "beta" ]; then
            MAJ_MIN=$(echo "$SHORT_VERSION" | cut -d. -f1-2)
            SHORT_VERSION="$MAJ_MIN.$((900 + ${{ github.run_number }} % 100))"
            echo "::warning::signal_worker=beta - version pinned to $SHORT_VERSION (staging sentinel train; expire the build in ASC after testing)"
          fi
          echo "::notice::iOS build version $SHORT_VERSION (build ${{ github.run_number }})"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" newtonia/ios/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $SHORT_VERSION" newtonia/ios/Info.plist
          # Also stamped into replay headers by the archive step below
          # (REPLAY.md R4: leaderboard seasons bucket by release).
          echo "SHORT_VERSION=$SHORT_VERSION" >> $GITHUB_ENV

      - name: Generate app icons
        run: |
          SRC="newtonia/icon-ios.png"
          ICONSET="newtonia/ios/Assets.xcassets/AppIcon.appiconset"
          sips -z 40   40   "$SRC" --out "$ICONSET/icon-20@2x.png"   >/dev/null
          sips -z 60   60   "$SRC" --out "$ICONSET/icon-20@3x.png"   >/dev/null
          sips -z 58   58   "$SRC" --out "$ICONSET/icon-29@2x.png"   >/dev/null
          sips -z 87   87   "$SRC" --out "$ICONSET/icon-29@3x.png"   >/dev/null
          sips -z 80   80   "$SRC" --out "$ICONSET/icon-40@2x.png"   >/dev/null
          sips -z 120  120  "$SRC" --out "$ICONSET/icon-40@3x.png"   >/dev/null
          sips -z 120  120  "$SRC" --out "$ICONSET/icon-60@2x.png"   >/dev/null
          sips -z 180  180  "$SRC" --out "$ICONSET/icon-60@3x.png"   >/dev/null
          sips -z 76   76   "$SRC" --out "$ICONSET/icon-76@1x.png"   >/dev/null
          sips -z 152  152  "$SRC" --out "$ICONSET/icon-76@2x.png"   >/dev/null
          sips -z 167  167  "$SRC" --out "$ICONSET/icon-83.5@2x.png" >/dev/null
          sips -z 1024 1024 "$SRC" --out "$ICONSET/icon-1024.png"    >/dev/null

      - name: Build with xcodebuild archive
        run: |
          SDL2_LIB=$(find "$(pwd)/SDL2/build-ios" -name "libSDL2.a" | head -1)
          SDL2MAIN_LIB=$(find "$(pwd)/SDL2/build-ios" -name "libSDL2main.a" | head -1)
          SDL2MIX_LIB=$(find "$(pwd)/SDL2_mixer/build-ios" -name "libSDL2_mixer.a" | head -1)
          # Netplay static archives: libdatachannel + its vendored deps +
          # MbedTLS (ld64 resolves across archives regardless of order).
          # Absolute paths: xcodebuild links with cwd at the PROJECT dir
          # (newtonia/ios), so relative archive paths don't resolve.
          NETLIBS=$(find "$(pwd)/libdatachannel/build-ios" "$(pwd)/netlibs/lib" -name "*.a" | sort -u | tr '\n' ' ')
          OTHER_LD="-ObjC $SDL2MAIN_LIB $SDL2_LIB $SDL2MIX_LIB $NETLIBS"

          # Point the build at the beta signaling worker when the manual dispatch
          # asks for it; tag pushes (and the production default) leave it empty,
          # so the baked production URL stands. Fills the project's
          # $(NEWTONIA_SIGNAL_DEFINE) placeholder (net_signal.cpp).
          SIGNAL_DEFINE=""
          if [ "${{ github.event.inputs.signal_worker }}" = "beta" ]; then
            SIGNAL_DEFINE="NEWTONIA_SIGNAL_BETA=1"
            echo "::notice::Build points at the BETA signaling worker (newtonia-signal-beta)."
          fi

          # NEWTONIA_NET_DEFINE / NEWTONIA_NET_HEADER_PATH / NEWTONIA_SIGNAL_DEFINE
          # are referenced by the project's GCC_PREPROCESSOR_DEFINITIONS /
          # HEADER_SEARCH_PATHS (empty when unset, so plain Xcode builds are
          # unaffected).
          #
          # The replay stamp is NOT $SHORT_VERSION: that is the marketing
          # version App Store Connect needs (bare dotted number), while the
          # R4 season key has to be the same string on every platform or one
          # release splits into two buckets — uncorrectably, since headers are
          # write-once. deploy-steam/itch stamp the tag verbatim ("v1.47.0"),
          # so put the "v" back on here (and on Android).
          REPLAY_VERSION="v$SHORT_VERSION"
          xcodebuild archive \
            -project newtonia/ios/Newtonia-iOS.xcodeproj \
            -scheme Newtonia \
            -sdk iphoneos \
            -configuration Release \
            -archivePath Newtonia.xcarchive \
            "SDL2_HEADER_PATH=$(pwd)/SDL2/include" \
            "SDL2_MIXER_HEADER_PATH=$(pwd)/SDL2_mixer/include" \
            "NEWTONIA_NET_DEFINE=NEWTONIA_NET_RTC=1" \
            "NEWTONIA_NET_HEADER_PATH=$(pwd)/libdatachannel/include" \
            "NEWTONIA_SIGNAL_DEFINE=$SIGNAL_DEFINE" \
            "NEWTONIA_VERSION_DEFINE=NEWTONIA_VERSION_STRING=\\\"$REPLAY_VERSION\\\"" \
            "OTHER_LDFLAGS=$OTHER_LD" \
            "CODE_SIGN_ENTITLEMENTS=$(pwd)/entitlements-final.plist" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      # Audio is bundled by the ios/project.yml folder resource (shared with
      # `make ios`, which needs it inside the signed bundle), so the archive
      # already contains it — verify instead of copying, so a project.yml
      # regression fails the deploy here rather than shipping a silent app.
      - name: Verify audio bundled by the project
        run: test -f "Newtonia.xcarchive/Products/Applications/Newtonia.app/audio/click.wav"

      - name: Export .ipa
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>cc.gfm.Newtonia</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath Newtonia.xcarchive \
            -exportPath IPA \
            -exportOptionsPlist ExportOptions.plist

      # Upload to TestFlight. Testers can install immediately;
      # submit for App Store review from App Store Connect UI.
      #
      # We invoke altool directly (rather than the
      # apple-actions/upload-testflight-build action) so the job's outcome
      # reflects the ACTUAL upload result. On run 217 the action reported the
      # job as "success" even though altool printed "UPLOAD FAILED with 3
      # errors" and nothing reached TestFlight — a rejected build looked green.
      # altool's --output-format xml result plist is the source of truth: a
      # failed upload carries a `product-errors` array, a successful one does
      # not. We parse it (and honour any non-zero altool exit) and fail the job
      # when the upload didn't actually go through.
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          # altool locates the App Store Connect API key by ID in a set of
          # well-known dirs; ~/.appstoreconnect/private_keys is the canonical one.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$API_PRIVATE_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_"$API_KEY_ID".p8

          # Run the upload, capturing the XML result plist to a file. Don't let
          # a non-zero exit abort the step before we've inspected the output.
          set +e
          xcrun altool --output-format xml --upload-app \
            --file IPA/Newtonia.ipa --type ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID" \
            1> upload-result.plist 2> upload-error.log
          ALTOOL_STATUS=$?
          set -e

          echo "altool exit status: $ALTOOL_STATUS"
          echo "===== altool stderr ====="
          cat upload-error.log 2>/dev/null || true
          echo "===== altool XML output ====="
          cat upload-result.plist 2>/dev/null || true
          echo "========================="

          # A failed upload's result plist carries a product-errors array;
          # a successful one does not. Treat its presence — or any non-zero
          # altool exit — as failure so the job status can't go green on a
          # rejected build.
          if /usr/libexec/PlistBuddy -c 'Print :product-errors' upload-result.plist >/dev/null 2>&1; then
            echo "::error::TestFlight upload FAILED — altool reported product-errors:"
            /usr/libexec/PlistBuddy -c 'Print :product-errors' upload-result.plist 2>&1 \
              | sed 's/^/    /'
            exit 1
          fi

          if [ "$ALTOOL_STATUS" -ne 0 ]; then
            echo "::error::TestFlight upload FAILED — altool exited $ALTOOL_STATUS (see stderr above)."
            exit "$ALTOOL_STATUS"
          fi

          echo "::notice::TestFlight upload succeeded."
