name: Netplay spike

# Phase 0 of NETPLAY.md: builds AND RUNS spike/netplay on a Windows runner —
# FetchContent MbedTLS v3.6.6 + libdatachannel v0.24.5, static CRT (/MT),
# MSVC + Ninja (same toolchain setup as xbox-dev.yml), then executes the
# C-API loopback which must print SPIKE PASS.
#
# Temporary workflow: delete (or leave as workflow_dispatch-only) once the
# real backend lands in xbox/CMakeLists.txt in Phase 2 and CI builds it.

on:
  push:
    branches: [master, main, 'claude/**']
    paths:
      - 'spike/netplay/**'
      - '.github/workflows/netplay-spike.yml'
  workflow_dispatch:

concurrency:
  group: netplay-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Configure + Build + Run (Ninja)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR (echo vswhere found no Visual Studio & exit /b 1)
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "PATH=%VSDIR%\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja;%PATH%"
          cmake -G Ninja -B spike\netplay\build -S spike\netplay ^
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build spike\netplay\build || exit /b 1
          rem Static CRT check: the exe must not import the dynamic CRT DLLs.
          dumpbin /dependents spike\netplay\build\netplay_spike.exe > deps.txt || exit /b 1
          type deps.txt
          findstr /i /c:"MSVCP140.dll" deps.txt && (echo dynamic CRT dependency found: /MT did not propagate & exit /b 1)
          findstr /i /c:"VCRUNTIME140.dll" deps.txt && (echo dynamic CRT dependency found: /MT did not propagate & exit /b 1)
          spike\netplay\build\netplay_spike.exe || exit /b 1
