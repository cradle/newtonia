name: Xbox

# Sole active workflow for the repo. Builds the GDK Desktop target — the
# SDL-WGL + desktop GL 3.3 core renderer (GLon12-capable, work-item 4a) — on a
# self-hosted Windows runner using the Ninja generator + MSVC.
#
# No GDK and no ANGLE: `cmake -B xbox/build-desktop -S xbox` builds standalone
# against SDL2/SDL2_mixer (fetched via FetchContent) + opengl32, statically
# linked (/MT), so newtonia.exe has no extra runtime DLLs to stage. Drop
# Mesa's GLon12 opengl32.dll next to it to run through OpenGL-on-D3D12 — see
# xbox/GLON12_SPIKE.md.
#
# Why Ninja: invokes cl.exe directly via vcvars64.bat — no MSBuild project
# generation or platform registration needed. See xbox/CMakeLists.txt.
#
# Runner prerequisites (installed once on the host):
#   * VS 2022 Build Tools — "Desktop development with C++" (MSVC v143, Win SDK,
#     CMake + Ninja). vcvars64.bat is located via vswhere.
#   * Internet access for the SDL2/SDL2_mixer FetchContent clone.

on:
  # Feature branches build via their PR only (pull_request). push is limited to
  # the mainline so merges still build without double-running open-PR branches.
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Auto-cancel a superseded in-progress run on the same ref.
concurrency:
  group: xbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # runs-on matches any self-hosted runner that has at least these labels,
    # so the existing runner (registered with
    # config.cmd --labels self-hosted,windows,gdk) still picks this up — the
    # gdk label is no longer required by the build itself.
    runs-on: [self-hosted, windows]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Configure + Build (Ninja)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR (echo vswhere found no Visual Studio & exit /b 1)
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          rem Ensure Ninja is on PATH (VS ships it under CommonExtensions).
          set "PATH=%VSDIR%\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja;%PATH%"
          cmake -G Ninja -B xbox\build-desktop -S xbox ^
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build xbox\build-desktop || exit /b 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: newtonia-gdk-desktop
          path: |
            xbox/build-desktop/newtonia.exe
            xbox/build-desktop/audio/
          retention-days: 7
