name: iOS

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

# Three jobs (task #158): `build` compiles the deps (cached) and the app,
# then `selftest` (simulator) and `xcode-parity` (deploy-ios build-settings
# gate) run IN PARALLEL off its artifacts — wall time is build + the slower
# of the two instead of the old single-job sum.
jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: newtonia

      # SDL2/SDL2_mixer/MbedTLS+libdatachannel are pinned versions built
      # from source — identical output every run, so cache the built trees
      # and skip the clone+build steps entirely on a hit. Bump the key when
      # changing any pin below or the MbedTLS user config.
      - name: Cache simulator dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            SDL2
            SDL2_mixer
            libdatachannel
            netlibs
          key: ios-sim-deps-v1-sdl2.32.10-mix2.8.2-mbedtls3.6.6-ldc0.24.5-${{ hashFiles('newtonia/xbox/mbedtls_user_config.h') }}

      # Network fetches retry with backoff, wiping partial state between
      # attempts — one transient GitHub 503 wave took out four workflow
      # runs at once (2026-08-03).
      - name: Clone SDL2
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          CLEAN=SDL2 try git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git SDL2

      - name: Clone SDL2_mixer
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          fetch() {
            git clone --depth 1 --branch release-2.8.2 https://github.com/libsdl-org/SDL_mixer.git SDL2_mixer &&
            git -C SDL2_mixer submodule update --init --depth 1
          }
          CLEAN=SDL2_mixer try fetch

      - name: Build SDL2 static library for iOS Simulator
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          cmake -S SDL2 -B SDL2/build-ios-sim \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_HIDAPI=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          cmake --build SDL2/build-ios-sim --config Release

      - name: Build SDL2_mixer static library for iOS Simulator
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          # SDL2_mixer's FindPrivateSDL2.cmake looks for SDL2_LIBRARY and
          # SDL2_INCLUDE_DIR directly; point them at the pre-built SDL2.
          SDL2_LIB=$(find "$(pwd)/SDL2/build-ios-sim" -name "libSDL2.a" | head -1)
          cmake -S SDL2_mixer -B SDL2_mixer/build-ios-sim \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DSDL_SHARED=OFF \
            -DSDL2MIXER_SHARED=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DSDL2MIXER_SAMPLES=OFF \
            -DSDL2MIXER_VORBIS="" \
            -DSDL2MIXER_WAVPACK=OFF \
            -DSDL2MIXER_FLAC=OFF \
            -DSDL2MIXER_OPUS=OFF \
            -DSDL2MIXER_MOD=OFF \
            -DSDL2MIXER_MIDI=OFF \
            -DSDL2MIXER_MP3=OFF \
            -DSDL2_LIBRARY="$SDL2_LIB" \
            -DSDL2_INCLUDE_DIR="$(pwd)/SDL2/include" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          cmake --build SDL2_mixer/build-ios-sim --config Release

      - name: Build MbedTLS + libdatachannel for iOS Simulator (netplay)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          # Same pins and DTLS-SRTP user config as every other platform
          # (see NETPLAY.md). Quotes must survive shell->CMake->compiler,
          # hence the backslash escaping (same trick as build_netplay_deps.sh).
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          UCFG="-DMBEDTLS_USER_CONFIG_FILE=\\\"$(pwd)/newtonia/xbox/mbedtls_user_config.h\\\""
          CLEAN=mbedtls try git clone --branch v3.6.6 --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/Mbed-TLS/mbedtls.git mbedtls
          cmake -S mbedtls -B mbedtls/build-ios-sim \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DCMAKE_C_FLAGS="$UCFG" \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/netlibs
          cmake --build mbedtls/build-ios-sim -j3
          cmake --install mbedtls/build-ios-sim

          CLEAN=libdatachannel try git clone --branch v0.24.5 --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/paullouisageneau/libdatachannel.git libdatachannel
          cmake -S libdatachannel -B libdatachannel/build-ios-sim \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DUSE_MBEDTLS=ON -DNO_MEDIA=ON -DNO_WEBSOCKET=OFF \
            -DNO_EXAMPLES=ON -DNO_TESTS=ON \
            -DCMAKE_PREFIX_PATH=$(pwd)/netlibs \
            -DCMAKE_FIND_ROOT_PATH=$(pwd)/netlibs \
            -DCMAKE_C_FLAGS="$UCFG" -DCMAKE_CXX_FLAGS="$UCFG"
          cmake --build libdatachannel/build-ios-sim -j3 --target datachannel-static

      - name: Collect game sources
        run: |
          find newtonia -name "*.cpp" \
            -not -name "glut.cpp" \
            -not -name "android_main.cpp" \
            -not -path "*/android/*" \
            -not -path "*/.git/*" \
            -not -path "*/CMakeFiles/*" \
            | sed 's|^newtonia/||' \
            > srcs.txt
          # Root Objective-C++ that compiles on iOS (all *.mm minus the
          # macOS-only entry points); mirrors ios/project.yml's *.mm glob so a
          # new ios_*.mm needs no edit here either.
          find newtonia -maxdepth 1 -name "*.mm" \
            -not -name "Newtonia.mm" \
            -not -name "macos_window.mm" \
            | sed 's|^newtonia/||' \
            >> srcs.txt
          echo "Sources to compile:"
          cat srcs.txt

      - name: Compile and link Newtonia for iOS Simulator
        run: |
          SYSROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)
          SIM_FLAGS="-arch arm64 -arch x86_64 -isysroot $SYSROOT -miphonesimulator-version-min=13.0"
          SDL2_LIB=$(find SDL2/build-ios-sim -name "libSDL2.a" | head -1)
          SDL2MAIN_LIB=$(find SDL2/build-ios-sim -name "libSDL2main.a" | head -1)
          SDL2MIX_LIB=$(find SDL2_mixer/build-ios-sim -name "libSDL2_mixer.a" | head -1)

          mkdir -p obj
          while IFS= read -r src; do
            objname=$(echo "$src" | tr '/' '_' | sed -E 's/\.(cpp|mm)$/.o/')
            # Objective-C++ compiles under ARC, matching the Xcode project
            # (game_center_achievements.mm assumes it)
            case "$src" in *.mm) ARC_FLAG="-fobjc-arc" ;; *) ARC_FLAG="" ;; esac
            clang++ $SIM_FLAGS $ARC_FLAG -std=c++11 -O2 \
              -D__IOS__=1 \
              -DNEWTONIA_NET_RTC \
              -DGAME_CENTER_BUILD=1 \
              -DNEWTONIA_NET_IDENTITY_BACKEND=1 \
              -DNEWTONIA_NET_VERIFY_BACKEND=1 \
              -Inewtonia -Inewtonia/view -Inewtonia/weapon \
              -I libdatachannel/include \
              -I SDL2/include \
              -I SDL2_mixer/include \
              -c "newtonia/$src" -o "obj/$objname"
          done < srcs.txt

          OBJS=$(find obj -name '*.o' | sort)
          if [ -z "$OBJS" ]; then
            echo "Error: no object files compiled" >&2; exit 1
          fi

          # Netplay static archives: libdatachannel + its vendored deps +
          # MbedTLS (ld64 resolves across archives regardless of order).
          NETLIBS=$(find libdatachannel/build-ios-sim netlibs/lib -name "*.a" | sort -u)
          echo "netplay archives:"; echo "$NETLIBS"

          mkdir -p Newtonia.app
          clang++ $SIM_FLAGS \
            -o Newtonia.app/Newtonia \
            $OBJS \
            "$SDL2MAIN_LIB" \
            "$SDL2_LIB" \
            "$SDL2MIX_LIB" \
            $NETLIBS \
            -framework OpenGLES \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework CoreMotion \
            -framework CoreAudio \
            -framework AudioToolbox \
            -framework AVFoundation \
            -framework CoreHaptics \
            -framework GameController \
            -framework GameKit \
            -framework QuartzCore \
            -framework Metal

      - name: Bundle .app
        run: |
          cp newtonia/ios/Info.plist Newtonia.app/Info.plist
          cp -r newtonia/audio Newtonia.app/audio
          zip -r Newtonia-iOS-Simulator.zip Newtonia.app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: newtonia-ios-simulator
          path: Newtonia-iOS-Simulator.zip
          retention-days: 7

      # Headers + static archives the xcode-parity job links against —
      # artifact hand-off instead of a shared cache so parity can never
      # race a cold cache. Short retention; it only feeds this run.
      - name: Package deps for the parity job
        run: |
          # One -T list, options before paths: macOS bsdtar stops option
          # parsing at the first path argument (GNU tar does not).
          find SDL2/build-ios-sim SDL2_mixer/build-ios-sim libdatachannel/build-ios-sim -name "*.a" > paths.txt
          printf '%s\n' SDL2/include SDL2_mixer/include libdatachannel/include netlibs >> paths.txt
          tar czf ios-sim-deps.tgz -T paths.txt

      - name: Upload deps artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim-deps
          path: ios-sim-deps.tgz
          retention-days: 1

  selftest:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Download simulator app
        uses: actions/download-artifact@v4
        with:
          name: newtonia-ios-simulator

      - name: Run netplay loopback + signal self-tests in the Simulator
        run: |
          unzip -q Newtonia-iOS-Simulator.zip
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; print(next(d['udid'] for v in ds.values() for d in v if 'iPhone' in d['name']))")
          echo "simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" Newtonia.app

          # Poll the log for the verdict instead of holding the launch's
          # pty: even though the app now hard-exits after a selftest
          # (ios_main.mm), `simctl launch --console-pty` has been seen
          # keeping the pty open past app exit — the old shape burned the
          # full watchdog window on every PASSING test. The launch runs in
          # the background; the loop moves on the moment the verdict line
          # appears, and the timeout only bites on a genuine hang.
          run_selftest() {  # $1=env var  $2=verdict prefix  $3=log  $4=timeout(s)
            : > "$3"
            env "SIMCTL_CHILD_$1=1" SIMCTL_CHILD_SDL_AUDIODRIVER=dummy \
              xcrun simctl launch --console-pty "$UDID" cc.gfm.Newtonia > "$3" 2>&1 &
            local pid=$! waited=0
            until grep -Eq "$2 (PASS|FAIL)" "$3"; do
              [ "$waited" -ge "$4" ] && break
              sleep 2; waited=$((waited + 2))
            done
            xcrun simctl terminate "$UDID" cc.gfm.Newtonia 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "--- $3 (${waited}s) ---"; cat "$3"
          }

          # Retried once: `simctl --console-pty` can drop the tail of the
          # app's output, losing the verdict line even though the test ran
          # (seen 2026-07-20: offer/answer/connected logged, PASS line
          # never delivered, watchdog burned). The test itself is pure
          # loopback, so a genuine regression fails both attempts.
          for attempt in 1 2; do
            run_selftest NEWTONIA_NET_SELFTEST "NET SELFTEST" selftest.log 180
            grep -q "NET SELFTEST PASS" selftest.log && break
            echo "net selftest attempt $attempt failed"
          done
          grep -q "NET SELFTEST PASS" selftest.log

          # Signal self-test: wss + TLS + a full room round-trip against the
          # PRODUCTION relay, from inside the iOS runtime (one short-lived
          # room per CI run; the relay's TTL cleans it up). A blip on the
          # production Worker or the runner's egress is not a code
          # regression (seen 2026-07-17: FAIL on a docs-only commit, green
          # either side) — retry up to 3x before declaring failure.
          for attempt in 1 2 3; do
            run_selftest NEWTONIA_SIGNAL_SELFTEST "SIGNAL SELFTEST" sigtest.log 120
            grep -q "SIGNAL SELFTEST PASS" sigtest.log && break
            echo "signal selftest attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          grep -q "SIGNAL SELFTEST PASS" sigtest.log

  # Deploy-parity gate: deploy-ios.yml builds through the Xcode PROJECT
  # (not the hand-rolled compile above), passing the netplay define,
  # header path and static archives as build settings. Build the same
  # project against the simulator SDK here so a pbxproj or build-setting
  # regression is caught on push instead of at TestFlight deploy time.
  xcode-parity:
    needs: build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: newtonia

      # The .xcodeproj is generated from ios/project.yml (gitignored), so a new
      # .cpp is picked up by the glob with no pbxproj edit.
      - name: Generate Xcode project (XcodeGen)
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20)); done; }
          try brew install xcodegen
          cd newtonia/ios && xcodegen generate --spec project.yml

      - name: Download deps artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-sim-deps

      - name: Unpack deps
        run: tar xzf ios-sim-deps.tgz

      - name: Xcode project netplay compile gate (deploy-ios parity)
        run: |
          SDL2_LIB=$(find "$(pwd)/SDL2/build-ios-sim" -name "libSDL2.a" | head -1)
          SDL2MAIN_LIB=$(find "$(pwd)/SDL2/build-ios-sim" -name "libSDL2main.a" | head -1)
          SDL2MIX_LIB=$(find "$(pwd)/SDL2_mixer/build-ios-sim" -name "libSDL2_mixer.a" | head -1)
          # Absolute paths: xcodebuild links with cwd at the PROJECT dir
          # (newtonia/ios), so relative archive paths don't resolve.
          NETLIBS=$(find "$(pwd)/libdatachannel/build-ios-sim" "$(pwd)/netlibs/lib" -name "*.a" | sort -u | tr '\n' ' ')
          OTHER_LD="-ObjC $SDL2MAIN_LIB $SDL2_LIB $SDL2MIX_LIB $NETLIBS"
          xcodebuild build \
            -project newtonia/ios/Newtonia-iOS.xcodeproj \
            -scheme Newtonia \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            "SDL2_HEADER_PATH=$(pwd)/SDL2/include" \
            "SDL2_MIXER_HEADER_PATH=$(pwd)/SDL2_mixer/include" \
            "NEWTONIA_NET_DEFINE=NEWTONIA_NET_RTC=1" \
            "NEWTONIA_NET_HEADER_PATH=$(pwd)/libdatachannel/include" \
            "NEWTONIA_VERSION_DEFINE=NEWTONIA_VERSION_STRING=\\\"${{ github.ref_name }}\\\"" \
            "OTHER_LDFLAGS=$OTHER_LD"
