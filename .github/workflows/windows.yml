name: Windows

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-freeglut
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_mixer

      # Netplay (NETPLAY.md): static libdatachannel, MinGW flavour. Uses
      # msys2's OpenSSL (static libs ship with the package) instead of the
      # MbedTLS-from-source recipe the Apple/Xbox builds need — no universal
      # binary or MSVC constraint here, and wss:// cert verification is
      # upstream-disabled on _WIN32 either way (NETPLAY.md session (n)).
      # Same libdatachannel pin as build_netplay_deps.sh / xbox.
      - name: Build libdatachannel (netplay, static)
        run: |
          mkdir netplay-deps
          git clone --branch v0.24.5 --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/paullouisageneau/libdatachannel.git netplay-deps/libdatachannel
          cmake -S netplay-deps/libdatachannel -B netplay-deps/libdatachannel/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DNO_MEDIA=ON -DNO_WEBSOCKET=OFF -DNO_EXAMPLES=ON -DNO_TESTS=ON
          cmake --build netplay-deps/libdatachannel/build --target datachannel-static

      - name: Build
        run: |
          SRCS=$(find . -name "*.cpp" \
            -not -path "./android/*" \
            -not -path "./.git/*" \
            -not -path "./netplay-deps/*")
          # All static archives from the libdatachannel build tree (itself +
          # vendored libjuice/usrsctp); --start-group resolves their circular
          # references. RTC_STATIC stops rtc.h declaring dllimport symbols.
          NETLIBS=$(find netplay-deps/libdatachannel/build -name "*.a" | sort -u)
          windres icon.rc -O coff -o icon.res
          g++ -O2 -Wall -std=c++11 -D_USE_MATH_DEFINES -DFREEGLUT_STATIC \
            -DNEWTONIA_NET_RTC -DRTC_STATIC \
            -Inetplay-deps/libdatachannel/include \
            $(pkg-config --cflags sdl2 SDL2_mixer freeglut) \
            -o newtonia.exe $SRCS icon.res \
            -static \
            $(pkg-config --libs --static sdl2 SDL2_mixer freeglut) \
            -Wl,--start-group $NETLIBS -Wl,--end-group \
            -lssl -lcrypto -lws2_32 -liphlpapi -lbcrypt -lcrypt32 \
            -lopengl32 -lglu32

      # In-process WebRTC loopback — runs before any window/GL is created
      # (glut.cpp), so it works headless on the runner.
      - name: Netplay loopback self-test
        run: |
          NEWTONIA_NET_SELFTEST=1 SDL_AUDIODRIVER=dummy ./newtonia.exe | tee selftest.log
          grep -q "NET SELFTEST PASS" selftest.log

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: newtonia-windows
          path: |
            newtonia.exe
            audio/
          retention-days: 7
