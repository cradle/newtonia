name: Windows

on:
  push:
    branches: [master, main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-freeglut
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_mixer

      - name: Build
        run: |
          SRCS=$(find . -name "*.cpp" \
            -not -path "./android/*" \
            -not -path "./.git/*" \
            -not -name "gles2_compat.cpp")
          windres icon.rc -O coff -o icon.res
          g++ -O2 -Wall -std=c++11 -D_USE_MATH_DEFINES -DFREEGLUT_STATIC \
            $(pkg-config --cflags sdl2 SDL2_mixer freeglut) \
            -o newtonia.exe $SRCS icon.res \
            -static \
            $(pkg-config --libs --static sdl2 SDL2_mixer freeglut) \
            -lopengl32 -lglu32

      # Sign the executable with Azure Trusted Signing ($10/mo, no USB token).
      # One-time Azure setup:
      #   1. Register Microsoft.CodeSigning resource provider in your subscription
      #   2. Create a Trusted Signing account (Basic plan) and verify your identity
      #   3. Create a Certificate Profile and note the profile name
      #   4. Create an App Registration in Entra ID, generate a client secret,
      #      and assign it the "Trusted Signing Certificate Profile Signer" role
      #   5. Store these GitHub secrets:
      #        AZURE_TENANT_ID      — Entra ID directory (tenant) ID
      #        AZURE_CLIENT_ID      — App Registration application (client) ID
      #        AZURE_CLIENT_SECRET  — App Registration client secret value
      # Without these secrets the signing step is skipped (e.g. on fork PRs).
      - name: Sign executable
        if: ${{ secrets.AZURE_TENANT_ID != '' }}
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: newtonia
          certificate-profile-name: newtonia
          files: newtonia.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: newtonia-windows
          path: |
            newtonia.exe
            audio/
          retention-days: 30
