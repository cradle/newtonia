name: Windows

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-freeglut
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_mixer

      # Netplay (NETPLAY.md): static libdatachannel, MinGW flavour. Uses
      # msys2's OpenSSL (static libs ship with the package) instead of the
      # MbedTLS-from-source recipe the Apple/Xbox builds need — no universal
      # binary or MSVC constraint here, and wss:// cert verification is
      # upstream-disabled on _WIN32 either way (NETPLAY.md session (n)).
      # Same libdatachannel pin as build_netplay_deps.sh / xbox.
      - name: Build libdatachannel (netplay, static)
        run: |
          # Retry with backoff, wiping the partial clone — a transient
          # GitHub 503 wave killed the deploy-steam twin of this step
          # (2026-08-03).
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          mkdir netplay-deps
          CLEAN=netplay-deps/libdatachannel try git clone --branch v0.24.5 --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/paullouisageneau/libdatachannel.git netplay-deps/libdatachannel
          # WS CA patch (LEADERBOARD.md S1): the C API gains caCertificatePemFile,
          # without which the credential-carrying sockets cannot verify anything.
          git -C netplay-deps/libdatachannel apply "$GITHUB_WORKSPACE/patches/libdatachannel-ws-ca-cert.patch"
          cmake -S netplay-deps/libdatachannel -B netplay-deps/libdatachannel/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DNO_MEDIA=ON -DNO_WEBSOCKET=OFF -DNO_EXAMPLES=ON -DNO_TESTS=ON
          cmake --build netplay-deps/libdatachannel/build --target datachannel-static

      - name: Build
        run: |
          SRCS=$(find . -name "*.cpp" \
            -not -path "./android/*" \
            -not -path "./test/*" \
            -not -path "./.git/*" \
            -not -path "./netplay-deps/*")
          # All static archives from the libdatachannel build tree (itself +
          # vendored libjuice/usrsctp); --start-group resolves their circular
          # references. RTC_STATIC stops rtc.h declaring dllimport symbols.
          NETLIBS=$(find netplay-deps/libdatachannel/build -name "*.a" | sort -u)
          windres icon.rc -O coff -o icon.res
          g++ -O2 -Wall -std=c++11 -D_USE_MATH_DEFINES -DFREEGLUT_STATIC \
            -DNEWTONIA_NET_RTC -DRTC_STATIC \
            -Inetplay-deps/libdatachannel/include \
            $(pkg-config --cflags sdl2 SDL2_mixer freeglut) \
            -o newtonia.exe $SRCS icon.res \
            -static \
            $(pkg-config --libs --static sdl2 SDL2_mixer freeglut) \
            -Wl,--start-group $NETLIBS -Wl,--end-group \
            -lssl -lcrypto -lws2_32 -liphlpapi -lbcrypt -lcrypt32 \
            -lopengl32 -lglu32

      # In-process WebRTC loopback — runs before any window/GL is created
      # (glut.cpp), so it works headless on the runner.
      - name: Netplay loopback self-test
        run: |
          NEWTONIA_NET_SELFTEST=1 SDL_AUDIODRIVER=dummy ./newtonia.exe | tee selftest.log
          grep -q "NET SELFTEST PASS" selftest.log

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: newtonia-windows
          path: |
            newtonia.exe
            audio/
          retention-days: 7

      # Deliberately AFTER the upload: this gate depends on a live relay,
      # and a blip that outlasts the retries should not also throw away a
      # perfectly good exe someone may want to download.
      # Real WSS handshake against the relay, which on Windows is the only
      # thing that proves the TLS trust path end to end (TESTING.md
      # "Per-platform TLS pass"). Windows links OpenSSL, but OpenSSL cannot
      # read the CryptoAPI store, so the carried bundle in net_ca_bundle.cpp
      # is the WHOLE trust story here — and libdatachannel falls back to
      # UNVERIFIED when no CA is supplied, so a failed bundle write is
      # silent on this platform. The loopback test above involves no TLS at
      # all and would not notice.
      #
      # Against the PRODUCTION relay — the baked default, no override.
      # Beta was the obvious choice (no CI rooms in production's Durable
      # Object state) and is the wrong one: deploy-signal auto-redeploys
      # beta from master on any signal/** change, so a beta regression
      # would turn this job red on unrelated PRs, and the retry cannot
      # tell that from a broken CA bundle. ios.yml made this call already.
      # The cost is one short-lived room per run, which the relay's TTL
      # reclaims.
      #
      # Retried like ios.yml's equivalent — a blip on the Worker or the
      # runner's egress is not a code regression, and the bundle either
      # verifies or it does not, so a real break fails all three.
      - name: Signal self-test (WSS + TLS trust path)
        # Bounded: ~40 s of waits per attempt plus two 20 s backoffs, so
        # ~3 min in the worst honest case. The cap is for a hang in
        # libdatachannel teardown, which would otherwise hold the runner
        # for the 360-minute default.
        timeout-minutes: 10
        run: |
          # Both patterns must hold in the SAME attempt, which is why each
          # gets its own log. A cumulative one could be satisfied by two
          # different runs — attempt 1 logging the CA line but failing the
          # round trip, attempt 2 connecting UNVERIFIED (the bundle write
          # can lose a file lock here) and passing — and the gate would go
          # green on precisely the failure it exists to catch. sigtest.log
          # accumulates anyway, but only so the diagnostics below can see
          # the whole run.
          : > sigtest.log
          ok=
          for attempt in 1 2 3; do
            : > attempt.log
            # 2>&1 matters: the PASS line is std::cout but the TLS line is
            # SDL_Log, which goes to STDERR.
            NEWTONIA_SIGNAL_SELFTEST=1 SDL_AUDIODRIVER=dummy ./newtonia.exe 2>&1 \
              | tee -a attempt.log || true
            cat attempt.log >> sigtest.log
            if grep -q "SIGNAL SELFTEST PASS" attempt.log &&
               grep -q "net: tls - verifying server certificates against" attempt.log; then
              ok=1
              break
            fi
            echo "signal selftest attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          # Only on the way out: a note about a rate-limited attempt on a
          # GREEN run would be a warning about a failure that did not happen.
          if [ -z "$ok" ]; then
            grep -q "rate-limited" sigtest.log &&
              echo "NOTE: the relay rate-limited at least one attempt - weigh that before reading this as a trust-path failure"
            echo "no attempt both passed and logged a verified handshake"
          fi
          [ -n "$ok" ]
