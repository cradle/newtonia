name: macOS Dev

on:
  push:
    branches: [master, main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # arm64 (Apple Silicon)

    steps:
      - uses: actions/checkout@v6

      # Both brew steps retry with backoff — a transient CDN failure in
      # `brew update` killed this workflow's x86_64 step outright
      # (2026-08-03; the SDL_mixer curl below already carried --retry).
      - name: Install arm64 dependencies
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20)); done; }
          try brew install sdl2 mpg123

      - name: Install x86_64 Homebrew and dependencies
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20)); done; }
          install_x86_brew() {
            arch -x86_64 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          }
          try install_x86_brew
          try arch -x86_64 /usr/local/bin/brew install sdl2 mpg123

      - name: Build SDL2_mixer from source (WAV + MP3 only)
        run: |
          SDL_MIXER_VER=2.8.2
          curl -fSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o SDL2_mixer.tar.gz \
            "https://github.com/libsdl-org/SDL_mixer/releases/download/release-${SDL_MIXER_VER}/SDL2_mixer-${SDL_MIXER_VER}.tar.gz"
          tar xzf SDL2_mixer.tar.gz
          cd SDL2_mixer-${SDL_MIXER_VER}

          cmake_flags=(
            -DCMAKE_BUILD_TYPE=Release
            -DSDL2MIXER_VENDORED=OFF
            -DSDL2MIXER_SAMPLES=OFF
            -DSDL2MIXER_OGG=OFF
            -DSDL2MIXER_FLAC=OFF
            -DSDL2MIXER_MIDI=OFF
            -DSDL2MIXER_OPUS=OFF
            -DSDL2MIXER_MOD=OFF
            -DSDL2MIXER_WAVPACK=OFF
            -DSDL2MIXER_MP3=ON
            -DSDL2MIXER_MP3_MPG123=ON
            -DSDL2MIXER_WAVE=ON
          )

          # arm64 — build natively on the arm64 runner
          cmake -B build-arm64 "${cmake_flags[@]}" \
            -DCMAKE_PREFIX_PATH=/opt/homebrew \
            -DCMAKE_INSTALL_PREFIX=/opt/homebrew
          cmake --build build-arm64 -j$(sysctl -n hw.logicalcpu)
          install_name_tool -id /opt/homebrew/lib/libSDL2_mixer.dylib \
            build-arm64/libSDL2_mixer.dylib
          cp build-arm64/libSDL2_mixer.dylib /opt/homebrew/lib/libSDL2_mixer.dylib

          # x86_64 — cross-compile using the native arm64 cmake
          cmake -B build-x86 "${cmake_flags[@]}" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_C_FLAGS="-target x86_64-apple-macos12.0" \
            -DCMAKE_CXX_FLAGS="-target x86_64-apple-macos12.0" \
            -DCMAKE_SHARED_LINKER_FLAGS="-target x86_64-apple-macos12.0" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build-x86 -j$(sysctl -n hw.logicalcpu)
          install_name_tool -id /usr/local/lib/libSDL2_mixer.dylib \
            build-x86/libSDL2_mixer.dylib
          cp build-x86/libSDL2_mixer.dylib /usr/local/lib/libSDL2_mixer.dylib

          # Headers (arch-independent)
          cp include/SDL_mixer.h /opt/homebrew/include/SDL2/SDL_mixer.h
          cp include/SDL_mixer.h /usr/local/include/SDL2/SDL_mixer.h

      - name: Collect sources
        run: |
          find . -name "*.cpp" \
            -not -path "./android/*" \
            -not -path "./test/*" \
            -not -path "./.git/*" > srcs.txt

      - name: Resolve version stamp
        run: |
          # Replay season key (REPLAY.md R4). This universal binary is the
          # one that gets notarized on tags, so it must not stamp replay.h's
          # "dev" fallback: the checkout is shallow with no tags, so take
          # the ref — a tag build stamps the tag verbatim (the rule every
          # deploy workflow follows) and everything else stamps the short
          # sha, an honest non-release string. The `make`-built netplay
          # binaries below inherit the same value from the environment.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "NEWTONIA_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "NEWTONIA_VERSION=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV
          fi

      - name: Build arm64
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          clang++ -O2 -Wall -std=c++11 -arch arm64 \
            -DGL_SILENCE_DEPRECATION \
            -DNEWTONIA_VERSION_STRING="\"$NEWTONIA_VERSION\"" \
            -mmacosx-version-min=12.0 \
            -o newtonia-arm64 $(cat srcs.txt) macos_window.mm \
            $(/opt/homebrew/bin/sdl2-config --cflags --libs) \
            -L/opt/homebrew/lib -lSDL2_mixer \
            -I/opt/homebrew/include/SDL2 \
            -framework GLUT -framework OpenGL -framework AppKit
          lipo -info newtonia-arm64

      - name: Build x86_64
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          clang++ -O2 -Wall -std=c++11 -arch x86_64 \
            -DGL_SILENCE_DEPRECATION \
            -DNEWTONIA_VERSION_STRING="\"$NEWTONIA_VERSION\"" \
            -mmacosx-version-min=12.0 \
            -o newtonia-x86_64 $(cat srcs.txt) macos_window.mm \
            $(/usr/local/bin/sdl2-config --cflags --libs) \
            -L/usr/local/lib -lSDL2_mixer \
            -I/usr/local/include/SDL2 \
            -framework GLUT -framework OpenGL -framework AppKit
          lipo -info newtonia-x86_64

      - name: Create universal binary
        run: lipo -create -output newtonia newtonia-arm64 newtonia-x86_64

      - name: Netplay build + loopback self-test (arm64, brew libdatachannel)
        run: |
          # Verifies the documented Mac netplay recipe (NETPLAY.md):
          #   ./build_netplay_deps.sh
          #   make NETPLAY=1 NETPLAY_PREFIX=$PWD/netplay-libs
          # then runs the in-process WebRTC loopback self-test headlessly.
          # The Makefile writes ./newtonia — stash the universal binary the
          # bundling steps below need, and restore it afterwards.
          mv newtonia newtonia-universal
          ./build_netplay_deps.sh
          make clean
          make -j3 NETPLAY=1 NETPLAY_PREFIX=$PWD/netplay-libs
          otool -L ./newtonia | grep -q libdatachannel
          NEWTONIA_NET_SELFTEST=1 SDL_AUDIODRIVER=dummy ./newtonia
          make clean

          # Universal netplay bundle: fat deps (MbedTLS — Homebrew OpenSSL
          # is single-arch), `make osx NETPLAY=1`, both architectures
          # asserted, self-test run from inside the bundle so the embedded
          # Frameworks/libdatachannel.dylib is what actually loads.
          ./build_netplay_deps.sh --universal netplay-libs-uni
          make osx NETPLAY=1 NETPLAY_PREFIX=$PWD/netplay-libs-uni
          lipo -info newtonia | grep arm64 | grep -q x86_64
          lipo -info Newtonia.app/Contents/Frameworks/libdatachannel.*.dylib | grep arm64 | grep -q x86_64
          NEWTONIA_NET_SELFTEST=1 SDL_AUDIODRIVER=dummy ./Newtonia.app/Contents/MacOS/Newtonia

          # Real WSS handshake from inside the SHIPPED bundle. This build is
          # the one that matters for TLS (TESTING.md "Per-platform TLS
          # pass"): the universal deps are MbedTLS — Homebrew's OpenSSL is
          # single-arch — and MbedTLS reaches no system trust store, so the
          # roots carried in net_ca_bundle.cpp are the whole story. It also
          # parses the bundle itself, and mbedtls_x509_crt_parse_file SKIPS
          # certificates it dislikes instead of erroring, so a root can go
          # missing with no complaint anywhere. A completed handshake is the
          # only thing that proves the bundle wrote, parsed, and verified
          # Cloudflare's real chain; the loopback test above involves no TLS.
          #
          # Beta relay, not production: same Cloudflare chain (the thing
          # under test), no CI rooms in production's Durable Object state.
          # Retried like ios.yml's equivalent, for the same reason — a
          # Worker or egress blip is not a code regression.
          for attempt in 1 2 3; do
            NEWTONIA_SIGNAL_URL=wss://newtonia-signal-beta.gfmcc.workers.dev/ws \
            NEWTONIA_SIGNAL_SELFTEST=1 SDL_AUDIODRIVER=dummy \
              ./Newtonia.app/Contents/MacOS/Newtonia 2>&1 | tee sigtest.log || true
            grep -q "SIGNAL SELFTEST PASS" sigtest.log && break
            echo "signal selftest attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          grep -q "SIGNAL SELFTEST PASS" sigtest.log
          # No CA-line grep here, unlike windows.yml, for two reasons. SDL
          # routes its log through NSLog on Apple and is excluded from the
          # stderr fallback, so the line reaches a terminal and not a CI
          # pipe (TESTING.md) — 2>&1 above is for diagnostics, not for
          # this. And it is not needed: MbedTLS fails CLOSED, so a PASS
          # already proves the bundle wrote, parsed and verified the chain.
          # Windows needs its grep precisely because it does NOT fail
          # closed.
          rm -f sigtest.log

          rm -rf Newtonia.app newtonia-arm64 newtonia-x86_64
          make clean
          mv newtonia-universal newtonia

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          printf '%s' "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"' | xargs) /Library/Keychains/System.keychain
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" "$KEYCHAIN"
          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo ""
            echo "ERROR: No 'Developer ID Application' identity found in the keychain." >&2
            echo "The DEVELOPER_ID_CERT_BASE64 secret must contain a Developer ID Application" >&2
            echo "certificate, not Developer ID Installer or any other type." >&2
            echo "" >&2
            echo "All identities present in the .p12 (any policy):" >&2
            security find-identity -v "$KEYCHAIN" >&2
            exit 1
          fi

      - name: Bundle .app
        run: |
          mkdir -p Newtonia.app/Contents/{MacOS,Frameworks,Resources}
          cp newtonia Newtonia.app/Contents/MacOS/Newtonia
          cp icon.icns Newtonia.app/Contents/Resources/icon.icns

          FW="Newtonia.app/Contents/Frameworks"

          # Recursively bundle all non-system dylibs into Frameworks/
          bundle() {
            local target="$1"
            # Collect deps from BOTH arch slices so fat-binary paths are all seen
            while IFS= read -r dep; do
              local name dest arm x86
              name=$(basename "$dep")
              dest="$FW/$name"
              # Compute the equivalent path in each Homebrew prefix
              arm=$(echo "$dep" | sed 's|/usr/local/|/opt/homebrew/|g')
              x86=$(echo "$dep" | sed 's|/opt/homebrew/|/usr/local/|g')
              if [ ! -f "$dest" ]; then
                if [ "$arm" != "$x86" ] && [ -f "$arm" ] && [ -f "$x86" ]; then
                  lipo -create "$arm" "$x86" -output "$dest"
                elif [ -f "$dep" ]; then
                  cp "$dep" "$dest"
                elif [ -f "$arm" ]; then
                  cp "$arm" "$dest"
                elif [ -f "$x86" ]; then
                  cp "$x86" "$dest"
                else
                  echo "WARNING: $dep not found, skipping" >&2
                  continue
                fi
                install_name_tool -id "@executable_path/../Frameworks/$name" "$dest"
                bundle "$dest"
                codesign --sign "Developer ID Application" --force --timestamp \
                  --options runtime "$dest"
              fi
              # Rewrite both arch prefixes in the target (fat binary has both)
              install_name_tool -change "$arm" "@executable_path/../Frameworks/$name" "$target" 2>/dev/null || true
              install_name_tool -change "$x86" "@executable_path/../Frameworks/$name" "$target" 2>/dev/null || true
            done < <(
              { otool -arch arm64  -L "$target" 2>/dev/null
                otool -arch x86_64 -L "$target" 2>/dev/null; } \
              | awk '/^\t/{print $1}' \
              | grep -Ev '^(/usr/lib|/System|@)' \
              | sort -u
            )
          }

          bundle Newtonia.app/Contents/MacOS/Newtonia
          codesign --sign "Developer ID Application" --force --timestamp \
            --options runtime \
            --entitlements macos/EntitlementsDevID.plist \
            Newtonia.app/Contents/MacOS/Newtonia

          cp -r audio Newtonia.app/Contents/Resources/audio

          cat > Newtonia.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>     <string>Newtonia</string>
            <key>CFBundleIdentifier</key>     <string>cc.gfm.Newtonia</string>
            <key>CFBundleName</key>           <string>Newtonia</string>
            <key>CFBundleIconFile</key>       <string>icon</string>
            <key>CFBundleVersion</key>        <string>1.0</string>
            <key>CFBundlePackageType</key>    <string>APPL</string>
            <key>LSMinimumSystemVersion</key> <string>12.0</string>
          </dict>
          </plist>
          PLIST

      - name: Sign .app bundle
        run: |
          codesign --sign "Developer ID Application" --force --timestamp \
            --options runtime \
            --entitlements macos/EntitlementsDevID.plist \
            Newtonia.app

      - name: Verify signature
        run: |
          codesign --verify --deep --strict --verbose=2 Newtonia.app
          spctl --assess --type exec --verbose Newtonia.app || true

      - name: Package .app as zip
        run: ditto -c -k --keepParent Newtonia.app newtonia-macos-dev.zip

      - name: Upload artifact (pre-notarization)
        uses: actions/upload-artifact@v7
        with:
          name: newtonia-macos-dev-unsigned
          path: newtonia-macos-dev.zip
          retention-days: 7

      - name: Notarize
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit newtonia-macos-dev.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple Newtonia.app
          ditto -c -k --keepParent Newtonia.app newtonia-macos-dev.zip

      - name: Upload artifact (notarized)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: newtonia-macos-dev
          path: newtonia-macos-dev.zip
          retention-days: 7
