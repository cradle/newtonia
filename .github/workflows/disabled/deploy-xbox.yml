name: Deploy Xbox

# Triggered manually or on a version tag (same convention as deploy-steam.yml).
# Required GitHub secrets (nothing deployment-specific is committed — the
# package identity is injected from these at Stage layout, same pattern as
# Steam's app_build.vdf appid):
#   Package identity (substituted into MicrosoftGame.config's __FILL_* tokens):
#     XBOX_IDENTITY_NAME             — Package/Identity Name
#     XBOX_IDENTITY_PUBLISHER        — Package/Identity Publisher (full CN=...)
#     XBOX_PUBLISHER_DISPLAY_NAME    — publisher display name
#     XBOX_STORE_ID                  — 12-char Store ID
#   Submission (StoreBroker auth):
#     XBOX_PARTNER_CENTER_TENANT_ID  — Azure AD tenant ID
#     XBOX_PARTNER_CENTER_CLIENT_ID  — Azure AD app (service principal) client ID
#     XBOX_PARTNER_CENTER_CLIENT_SECRET — service principal secret
#
# xbox/PARTNER_CENTER_VALUES.md is the single checklist of these secrets and
# where each comes from in Partner Center. The committed MicrosoftGame.config
# keeps __FILL_* tokens, so the repo stays reusable with no identity in source.
#
# STATUS: still disabled — needs a self-hosted GDKX runner (label "gdkx") and a
# dev kit to validate. The build now configures + builds the DECIDED console
# path: the Scarlett GLon12 target (xbox/CMakeLists.txt -DXBOX_SCARLETT=ON →
# _GAMING_DESKTOP + NEWTONIA_GDK_CONSOLE, the desktop-GL renderer through Mesa's
# GLon12, same code the GDK Desktop build and xbox-console-smoke.yml exercise).
# Remaining GXDK-gated pieces (PORT_PLAN Phase 2/3, marked TODO in the steps):
# the SDL VisualC-GDK backend (work-item #4) and a Mesa-for-Xbox GLon12 build
# (opengl32/libgallium_wgl). Identity, secrets, packaging, and submission
# scaffolding are ready; flip the runner + provide the GLon12 redist to use it.
#
# One-time Partner Center setup
# ------------------------------
# 1. Enrol in ID@Xbox at https://developer.microsoft.com/games
# 2. Create the title in Partner Center and note the Store ID.
# 3. In Azure Portal, create an App Registration (service principal).
# 4. In Partner Center → Account settings → User management, add that app
#    as a "Manager" for the title.
# 5. Store all the secrets above as GitHub encrypted secrets
#    (see xbox/PARTNER_CENTER_VALUES.md). No source edits are needed —
#    the identity is injected from secrets at build time.
#
# GDK version
# -----------
# The installed GDKX edition is discovered at runtime from the GameDKLatest
# machine environment variable (set by the GDKX installer on the self-hosted
# runner), so no hardcoded edition number needs updating.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      submission_notes:
        description: 'Notes for this Partner Center submission'
        required: false
        default: ''

jobs:
  # ------------------------------------------------------------------ #
  # 1. Build the Xbox package                                           #
  # ------------------------------------------------------------------ #
  build:
    # Console (Scarlett) packaging requires the NDA GDKX, which CANNOT be
    # installed on GitHub-hosted runners (the public GDK ZIP has only the GRDK
    # PC platform; the Scarlett platform + D3D12.X are GDKX-only). Use a
    # self-hosted Windows runner that already has GDKX + Visual Studio + Ninja
    # installed, labelled "gdkx". The build mirrors xbox-dev.yml's strategy
    # (Ninja + MSVC, no GDK MSBuild platform) — see the Configure step.
    runs-on: [self-hosted, windows, gdkx]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Check required identity secrets
        shell: pwsh
        env:
          XBOX_IDENTITY_NAME:          ${{ secrets.XBOX_IDENTITY_NAME }}
          XBOX_IDENTITY_PUBLISHER:     ${{ secrets.XBOX_IDENTITY_PUBLISHER }}
          XBOX_PUBLISHER_DISPLAY_NAME: ${{ secrets.XBOX_PUBLISHER_DISPLAY_NAME }}
          XBOX_STORE_ID:               ${{ secrets.XBOX_STORE_ID }}
        run: |
          # Identity comes entirely from secrets — nothing deployment-specific is
          # committed (MicrosoftGame.config keeps __FILL_* tokens, substituted at
          # Stage layout). Fail fast before the long build if any is missing.
          # Read via env (not string interpolation) so values never hit the log.
          $missing = @()
          foreach ($n in 'XBOX_IDENTITY_NAME','XBOX_IDENTITY_PUBLISHER',
                          'XBOX_PUBLISHER_DISPLAY_NAME','XBOX_STORE_ID') {
            if (-not [Environment]::GetEnvironmentVariable($n)) { $missing += $n }
          }
          if ($missing) {
            Write-Error "Missing required secret(s): $($missing -join ', '). See xbox/PARTNER_CENTER_VALUES.md."
            exit 1
          }
          Write-Host "All identity secrets present."

      - name: Locate GDKX
        shell: pwsh
        run: |
          # Console build uses the GDKX (Xbox extensions) already installed on
          # this self-hosted runner. GXDK provides the Scarlett platform that the
          # public GRDK ZIP does not contain, so there is no winget install or
          # BWOI download here — we just point the build at the installed edition.
          $gdkLatest = [Environment]::GetEnvironmentVariable("GameDKLatest","Machine")
          if (-not $gdkLatest) {
            $base = "C:\Program Files (x86)\Microsoft GDK"
            $found = Get-ChildItem $base -Directory -ErrorAction SilentlyContinue |
                       Where-Object { $_.Name -match '^\d+$' } |
                       Sort-Object Name -Descending | Select-Object -First 1
            if ($found) { $gdkLatest = $found.FullName }
          }
          if (-not $gdkLatest) {
            Write-Error "GDKX not found on this runner. Install the GDK with Xbox extensions and label the runner 'gdkx'."
            exit 1
          }
          $gdkLatest = $gdkLatest.TrimEnd('\')
          $ed = Split-Path $gdkLatest -Leaf
          echo "GDK_EDITION=$ed"          >> $env:GITHUB_ENV
          echo "GDK_LATEST=$gdkLatest"    >> $env:GITHUB_ENV
          echo "GDK_ROOT=$gdkLatest\GRDK" >> $env:GITHUB_ENV   # makepkg lives under GRDK\bin
          # GXDK header/lib dirs for the Scarlett GLon12 build. TODO(GXDK):
          # confirm these subpaths against the installed edition's layout.
          echo "GRDK_INCLUDE=$gdkLatest\GRDK\GameKit\Include"               >> $env:GITHUB_ENV
          echo "GXDK_INCLUDE=$gdkLatest\GXDK\GameKit\Include"               >> $env:GITHUB_ENV
          echo "GXDK_LIBDIR=$gdkLatest\GXDK\GameKit\Lib\amd64\Scarlett"     >> $env:GITHUB_ENV
          Write-Host "GDKX edition $ed at $gdkLatest"

      # ---- Locate the Xbox GLon12 redist ----------------------------
      - name: Locate GLon12 redist
        shell: pwsh
        run: |
          # Decided renderer: Mesa GLon12 (OpenGL-on-D3D12) built for the Xbox
          # cross target. The runner must provide opengl32.dll + .lib and
          # libgallium_wgl.dll (set NEWTONIA_GLON12_DIR on the runner).
          # TODO(GXDK Phase 2): building Mesa's d3d12 driver for Xbox is gated on
          # GXDK + a Microsoft agreement — see xbox/PORT_PLAN.md / GLON12_SPIKE.md.
          $dir = $env:NEWTONIA_GLON12_DIR
          if (-not $dir -or -not (Test-Path "$dir\opengl32.lib")) {
            Write-Error "Xbox GLon12 redist not found. Set NEWTONIA_GLON12_DIR on the runner (opengl32.dll/.lib, libgallium_wgl.dll). See xbox/PORT_PLAN.md Phase 2."
            exit 1
          }
          echo "GLON12_DIR=$dir" >> $env:GITHUB_ENV
          Write-Host "GLon12 redist: $dir"

      # ---- Configure + Build (Ninja, Scarlett GLon12) ---------------
      - name: Configure + Build (Ninja, Scarlett GLon12)
        shell: cmd
        run: |
          rem Decided console path: the desktop-GL renderer built for Scarlett
          rem through Mesa GLon12 (xbox/CMakeLists.txt XBOX_SCARLETT block ->
          rem _GAMING_DESKTOP + NEWTONIA_GDK_CONSOLE + WINAPI_FAMILY_GAMES).
          rem Mirrors xbox-dev.yml: Ninja + MSVC, NO GDK MSBuild platform.
          rem TODO(GXDK work-item #4): switch SDL2 to its official VisualC-GDK
          rem build for real console windowing/input (the current /U__GDK__ Win32
          rem hack is unvalidated on a kit). See xbox/PORT_PLAN.md Phase 2.
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || ^
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          cmake -G Ninja -B xbox\build -S xbox ^
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_BUILD_TYPE=Release -DXBOX_SCARLETT=ON ^
            -DGDK_INCLUDE_DIR="%GRDK_INCLUDE%" ^
            -DGXDK_INCLUDE_DIR="%GXDK_INCLUDE%" ^
            -DGXDK_LIB_DIR="%GXDK_LIBDIR%" ^
            -DGLON12_LIB="%GLON12_DIR%\opengl32.lib" || exit /b 1
          cmake --build xbox\build || exit /b 1

      # ---- Assemble the layout directory for makepkg -----------------
      - name: Stage layout
        shell: pwsh
        env:
          XBOX_IDENTITY_NAME:          ${{ secrets.XBOX_IDENTITY_NAME }}
          XBOX_IDENTITY_PUBLISHER:     ${{ secrets.XBOX_IDENTITY_PUBLISHER }}
          XBOX_PUBLISHER_DISPLAY_NAME: ${{ secrets.XBOX_PUBLISHER_DISPLAY_NAME }}
          XBOX_STORE_ID:               ${{ secrets.XBOX_STORE_ID }}
        run: |
          New-Item -ItemType Directory -Force -Path xbox_output\bin | Out-Null

          # Executable (Ninja is single-config — no Release\ subdir)
          Copy-Item xbox\build\newtonia.exe xbox_output\bin\

          # GLon12 redist DLLs (decided renderer) — opengl32.dll + Gallium WGL
          # frontend (+ dxil.dll if the Mesa build needs it).
          $glon12 = $env:GLON12_DIR
          foreach ($dll in 'opengl32.dll','libgallium_wgl.dll','dxil.dll') {
            $src = Join-Path $glon12 $dll
            if (Test-Path $src) { Copy-Item $src xbox_output\bin\ }
            elseif ($dll -ne 'dxil.dll') { Write-Warning "GLon12 DLL missing: $src" }
          }

          # Audio assets
          Copy-Item -Recurse audio xbox_output\bin\audio

          # Package manifest (must sit at the layout root). Identity is injected
          # from secrets here so nothing deployment-specific lives in source —
          # same pattern as Steam's app_build.vdf appid.
          $cfg = Get-Content xbox\MicrosoftGame.config -Raw
          $cfg = $cfg.Replace('__FILL_IDENTITY_NAME__',          $env:XBOX_IDENTITY_NAME)
          $cfg = $cfg.Replace('__FILL_IDENTITY_PUBLISHER__',     $env:XBOX_IDENTITY_PUBLISHER)
          $cfg = $cfg.Replace('__FILL_PUBLISHER_DISPLAY_NAME__', $env:XBOX_PUBLISHER_DISPLAY_NAME)
          $cfg = $cfg.Replace('__FILL_STORE_ID__',               $env:XBOX_STORE_ID)
          if ($cfg -match '__FILL_') {
            Write-Error "Unsubstituted __FILL_ token remains in MicrosoftGame.config"; exit 1
          }
          Set-Content -Path xbox_output\MicrosoftGame.config -Value $cfg -Encoding utf8

          # Tile / splash image assets
          if (Test-Path xbox\Assets) {
            Copy-Item -Recurse xbox\Assets xbox_output\Assets
          } else {
            Write-Warning "xbox\Assets not found — add StoreLogo.png, Logo480x480.png, Logo150x150.png, SplashScreen.png before submitting."
            New-Item -ItemType Directory -Force -Path xbox_output\Assets | Out-Null
          }

      # ---- Package with makepkg -------------------------------------
      - name: Package (.xvc)
        shell: pwsh
        run: |
          $makepkg = "$env:GDK_ROOT\bin\makepkg.exe"
          New-Item -ItemType Directory -Force -Path packages | Out-Null
          & $makepkg pack `
            /f xbox\PackagingLayout.xml `
            /d xbox_output `
            /pd packages `
            /pc    # include content ID in the package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbox-package
          path: packages\*.xvc
          retention-days: 14

  # ------------------------------------------------------------------ #
  # 2. Submit to Partner Center via StoreBroker                        #
  # ------------------------------------------------------------------ #
  submit:
    needs: build
    runs-on: windows-latest
    # Gate on the "xbox-release" environment so a human can approve before
    # the package is sent live.  Create this environment in:
    # GitHub → Settings → Environments → New environment → xbox-release
    environment: xbox-release

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xbox-package
          path: packages\

      # StoreBroker is Microsoft's PowerShell module for Partner Center
      # submission automation.
      # https://github.com/microsoft/StoreBroker
      - name: Install StoreBroker
        shell: pwsh
        run: |
          Install-Module -Name StoreBroker -Force -Scope CurrentUser -AllowClobber

      - name: Submit to Partner Center
        shell: pwsh
        env:
          TENANT_ID:     ${{ secrets.XBOX_PARTNER_CENTER_TENANT_ID }}
          CLIENT_ID:     ${{ secrets.XBOX_PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.XBOX_PARTNER_CENTER_CLIENT_SECRET }}
          STORE_ID:      ${{ secrets.XBOX_STORE_ID }}
          NOTES:         ${{ github.event.inputs.submission_notes || github.ref_name }}
        run: |
          # Authenticate the service principal with Partner Center.
          $cred = [PSCredential]::new(
            $env:CLIENT_ID,
            (ConvertTo-SecureString $env:CLIENT_SECRET -AsPlainText -Force)
          )
          Set-StoreBrokerAuthentication `
            -TenantId $env:TENANT_ID `
            -Credential $cred

          $pkg = (Get-ChildItem packages\*.xvc | Select-Object -First 1).FullName
          if (-not $pkg) { Write-Error "No .xvc package found"; exit 1 }

          Write-Host "Submitting $pkg to Store ID $env:STORE_ID"

          # Create a new draft submission, upload the package, then commit.
          # StoreBroker clones the last published submission as the base so
          # metadata (description, screenshots, pricing) is preserved.
          $sub = New-ApplicationSubmission -AppId $env:STORE_ID -Force
          $subId = $sub.id

          Set-ApplicationSubmissionPackage `
            -AppId        $env:STORE_ID `
            -SubmissionId $subId `
            -PackagePath  $pkg

          # Optionally record what triggered this submission.
          if ($env:NOTES) {
            Update-ApplicationSubmission `
              -AppId        $env:STORE_ID `
              -SubmissionId $subId `
              -NotesForCertification $env:NOTES
          }

          Complete-ApplicationSubmission `
            -AppId        $env:STORE_ID `
            -SubmissionId $subId

          Write-Host "Submission $subId committed. Monitor progress in Partner Center."
