name: Deploy Itch.io

# v*.*.* tags (or manual dispatch) push two builds: the public html5
# channel (netless — pricing decision in NETPLAY.md) and the netplay-ON
# build to the newtonia-online project, which is UNPUBLISHED (Draft) —
# that push is deliberately inert, see the step's comment below. (The
# netplay-v* test namespace and its html5-netplay channel retired
# post-launch — task #157.)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  deploy-itch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (for tsc)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Network fetches retry with backoff, wiping partial state between
      # attempts — one transient GitHub 503 wave took out four workflow
      # runs at once (2026-08-03).
      - name: Install TypeScript
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20)); done; }
          try npm install -g typescript

      - name: Compile TypeScript UI
        working-directory: web
        run: tsc

      - name: Install Emscripten SDK
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          fetch() {
            git clone https://github.com/emscripten-core/emsdk.git ~/emsdk &&
            ~/emsdk/emsdk install latest &&
            ~/emsdk/emsdk activate latest
          }
          CLEAN=$HOME/emsdk try fetch

      - name: Build WebAssembly
        run: |
          # Stamped into replay headers (REPLAY.md R4: leaderboard seasons
          # bucket by the SEASON file, bumped deliberately on significant
          # gameplay changes — LEADERBOARD.md season decision). Tag builds
          # stamp the SEASON file; a manual dispatch stamps the branch name,
          # the same honest non-release bucket as deploy-steam/ios.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            export NEWTONIA_VERSION="$(tr -d '[:space:]' < SEASON)"
          else
            export NEWTONIA_VERSION="${{ github.ref_name }}"
          fi
          source ~/emsdk/emsdk_env.sh
          emcc --version
          # The FREE public channel ships netplay force-disabled
          # permanently (pricing decision in NETPLAY.md: paid on
          # Steam/iOS, so free browser co-op would undercut them).
          # Browser co-op was to be the newtonia-online project below,
          # which is parked/unpublished — that does not change this
          # channel, which is netless either way.
          make web NETPLAY=0

      - name: Install butler
        run: |
          set -euo pipefail
          # itch's own distribution channel, not the GitHub API. The old step
          # asked api.github.com for butler's latest tag UNAUTHENTICATED,
          # which is rate-limited per runner IP: on v1.48.0 the query came
          # back without a tag_name, `jq -r` printed "null", the download URL
          # 404'd, and butler.zip was a 9-byte "Not Found" that unzip
          # rejected with a message about multi-part archives — a failure
          # that named neither the rate limit nor the release. broth is what
          # itch documents, needs no API call, and always serves LATEST.
          curl -fL --retry 3 --retry-all-errors -o butler.zip \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          # broth's archive has butler at the root; the push steps below
          # expect linux-amd64/butler, so unpack it there.
          unzip -q butler.zip -d linux-amd64
          chmod +x linux-amd64/butler
          linux-amd64/butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          # Upload only the playable game (web/dist/play), not the landing
          # page that web/dist serves at the root of the GitHub Pages site.
          linux-amd64/butler push web/dist/play \
            ${{ secrets.ITCH_GAME }}:html5 \
            --userversion "${{ github.ref_name || github.sha }}"

      # Paid web co-op (task #156) — WIRED BUT INERT. Every public release
      # ships the netplay-ON build to newtonia-online, but that project is
      # UNPUBLISHED (Draft) and nobody can reach it: itch CANNOT
      # purchase-gate an HTML5 embed (a minimum price restricts downloads
      # only — a long-declined itch feature), so "itch is the accounts
      # system" does not hold and the original design fell through
      # (NETPLAY.md Gate 5, 2026-07-18). The viable unblock is server-side
      # purchase verification in the signaling Worker (itch download key /
      # OAuth); until someone builds it, publishing the project would give
      # away paid co-op. The push stays wired so that day is a portal
      # action, not a workflow change. Not a release dependency — this step
      # failing blocks nothing real.
      # The free public page above stays NETPLAY=0 by the pricing decision
      # in NETPLAY.md (paid on Steam/iOS; free browser co-op would undercut
      # them). Same origin allowlist covers both projects
      # (metonymous.itch.io + the itch.zone/hwcdn iframe hosts).
      - name: Build WebAssembly (netplay, paid online project)
        run: |
          # Stamped into replay headers (REPLAY.md R4: leaderboard seasons
          # bucket by the SEASON file, bumped deliberately on significant
          # gameplay changes — LEADERBOARD.md season decision). Tag builds
          # stamp the SEASON file; a manual dispatch stamps the branch name,
          # the same honest non-release bucket as deploy-steam/ios.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            export NEWTONIA_VERSION="$(tr -d '[:space:]' < SEASON)"
          else
            export NEWTONIA_VERSION="${{ github.ref_name }}"
          fi
          source ~/emsdk/emsdk_env.sh
          make web-clean
          make web

      - name: Push to itch.io (paid online project)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
          ITCH_GAME: ${{ secrets.ITCH_GAME }}
        run: |
          # Same itch user as the public project, fixed project slug.
          linux-amd64/butler push web/dist/play \
            "${ITCH_GAME%%/*}/newtonia-online:html5" \
            --userversion "${{ github.ref_name || github.sha }}"
