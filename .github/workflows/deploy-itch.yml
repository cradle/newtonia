name: Deploy Itch.io

# v*.*.* tags push the public html5 channel; netplay-v* tags (netplay test
# releases) push a separate html5-netplay channel so the public game is
# untouched.
on:
  push:
    tags:
      - 'v*.*.*'
      - 'netplay-v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'itch.io channel (e.g. html5, html5-netplay)'
        required: true
        default: 'html5'

jobs:
  deploy-itch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (for tsc)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install TypeScript
        run: npm install -g typescript

      - name: Compile TypeScript UI
        working-directory: web
        run: tsc

      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install latest
          ~/emsdk/emsdk activate latest

      - name: Pick itch channel
        id: chan
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          if [ -z "$CHANNEL" ]; then
            case "${{ github.ref_name }}" in
              netplay-*) CHANNEL=html5-netplay ;;
              *)         CHANNEL=html5 ;;
            esac
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Build WebAssembly
        run: |
          source ~/emsdk/emsdk_env.sh
          emcc --version
          # Release channel ships netplay force-disabled until live
          # Worker/TURN usage is understood (NETPLAY.md release
          # checklist); the netplay test channel keeps it on.
          if [ "${{ steps.chan.outputs.channel }}" = "html5-netplay" ]; then
            make web
          else
            make web NETPLAY=0
          fi

      - name: Install butler
        run: |
          BUTLER_VERSION=$(curl -s https://api.github.com/repos/itchio/butler/releases/latest | jq -r .tag_name)
          curl -L -o butler.zip "https://github.com/itchio/butler/releases/download/${BUTLER_VERSION}/butler-linux-amd64.zip"
          unzip butler.zip
          chmod +x linux-amd64/butler
          linux-amd64/butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          # Upload only the playable game (web/dist/play), not the landing
          # page that web/dist serves at the root of the GitHub Pages site.
          linux-amd64/butler push web/dist/play \
            ${{ secrets.ITCH_GAME }}:${{ steps.chan.outputs.channel }} \
            --userversion "${{ github.ref_name || github.sha }}"
