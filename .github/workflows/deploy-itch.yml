name: Deploy Itch.io

# v*.*.* tags (or manual dispatch) push two builds: the public html5
# channel (netless — pricing decision in NETPLAY.md) and the netplay-ON
# build to the purchase-gated newtonia-online project. (The netplay-v*
# test namespace and its html5-netplay channel retired post-launch —
# task #157.)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  deploy-itch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (for tsc)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install TypeScript
        run: npm install -g typescript

      - name: Compile TypeScript UI
        working-directory: web
        run: tsc

      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install latest
          ~/emsdk/emsdk activate latest

      - name: Build WebAssembly
        run: |
          source ~/emsdk/emsdk_env.sh
          emcc --version
          # The FREE public channel ships netplay force-disabled
          # permanently (pricing decision in NETPLAY.md: paid on
          # Steam/iOS, browser co-op is the paid newtonia-online
          # project below).
          make web NETPLAY=0

      - name: Install butler
        run: |
          BUTLER_VERSION=$(curl -s https://api.github.com/repos/itchio/butler/releases/latest | jq -r .tag_name)
          curl -L -o butler.zip "https://github.com/itchio/butler/releases/download/${BUTLER_VERSION}/butler-linux-amd64.zip"
          unzip butler.zip
          chmod +x linux-amd64/butler
          linux-amd64/butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
        run: |
          # Upload only the playable game (web/dist/play), not the landing
          # page that web/dist serves at the root of the GitHub Pages site.
          linux-amd64/butler push web/dist/play \
            ${{ secrets.ITCH_GAME }}:html5 \
            --userversion "${{ github.ref_name || github.sha }}"

      # Paid web co-op (task #156): every public release also ships the
      # netplay-ON build to the purchase-gated newtonia-online project —
      # itch is the accounts system, so only buyers get the embed. The
      # free public page above stays NETPLAY=0 by the pricing decision in
      # NETPLAY.md (paid on Steam/iOS; free browser co-op would undercut
      # them). Same origin allowlist covers both projects
      # (metonymous.itch.io + the itch.zone/hwcdn iframe hosts).
      - name: Build WebAssembly (netplay, paid online project)
        run: |
          source ~/emsdk/emsdk_env.sh
          make web-clean
          make web

      - name: Push to itch.io (paid online project)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
          ITCH_GAME: ${{ secrets.ITCH_GAME }}
        run: |
          # Same itch user as the public project, fixed project slug.
          linux-amd64/butler push web/dist/play \
            "${ITCH_GAME%%/*}/newtonia-online:html5" \
            --userversion "${{ github.ref_name || github.sha }}"
