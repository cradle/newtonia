name: Deploy Steam

# v*.*.* tags deploy to the 'beta' branch; promote to default in the
# Steamworks portal once smoke-tested. (The netplay-v* test namespace
# retired post-launch — task #157; test pushes go via manual dispatch
# to a branch of your choice.)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Steam branch to deploy to (e.g. beta, default)'
        required: true
        default: 'beta'

# Stamped into every replay header (REPLAY.md R4: leaderboard seasons bucket
# by the SEASON file, bumped deliberately on significant gameplay changes —
# LEADERBOARD.md season decision). Each build job overrides this with the
# checked-out SEASON file's content; this env is only the fallback if that
# step is ever skipped. These jobs compile with inline g++/clang++ rather
# than the Makefile, so the define goes on each command below.
env:
  NEWTONIA_VERSION: ${{ github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Season stamp (SEASON file, tag builds only)
        if: github.ref_type == 'tag'
        shell: bash
        run: echo "NEWTONIA_VERSION=$(tr -d '[:space:]' < SEASON)" >> "$GITHUB_ENV"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-freeglut
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-tools-git

      # Netplay (NETPLAY.md): static libdatachannel, MinGW flavour — same
      # recipe as windows.yml (the dev CI is the compile gate for this).
      - name: Build libdatachannel (netplay, static)
        run: |
          # Retry with backoff, wiping the partial clone — a transient
          # GitHub 503 wave killed this exact step (2026-08-03).
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          mkdir netplay-deps
          CLEAN=netplay-deps/libdatachannel try git clone --branch v0.24.5 --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/paullouisageneau/libdatachannel.git netplay-deps/libdatachannel
          # WS CA patch (LEADERBOARD.md S1): the C API gains caCertificatePemFile,
          # without which the credential-carrying sockets cannot verify anything.
          git -C netplay-deps/libdatachannel apply "$GITHUB_WORKSPACE/patches/libdatachannel-ws-ca-cert.patch"
          cmake -S netplay-deps/libdatachannel -B netplay-deps/libdatachannel/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DNO_MEDIA=ON -DNO_WEBSOCKET=OFF -DNO_EXAMPLES=ON -DNO_TESTS=ON
          cmake --build netplay-deps/libdatachannel/build --target datachannel-static

      - name: Download Steamworks SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.STEAM_SDK_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/cradle/assets/releases/tags/sdk-latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq "steamworks_sdk.zip" } | Select-Object -First 1
          $dlHeaders = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/octet-stream" }
          Invoke-WebRequest -Uri $asset.url -Headers $dlHeaders -OutFile steamworks_sdk.zip
          Expand-Archive -Path steamworks_sdk.zip -DestinationPath .

      - name: Generate MinGW import library for steam_api64
        run: |
          cp sdk/redistributable_bin/win64/steam_api64.dll .
          gendef steam_api64.dll
          dlltool -D steam_api64.dll -d steam_api64.def -l libsteam_api64.a

      - name: Build
        run: |
          SRCS=$(find . -name "*.cpp" \
            -not -path "./android/*" \
            -not -path "./test/*" \
            -not -path "./.git/*" \
            -not -path "./sdk/*" \
            -not -path "./netplay-deps/*")
          NETLIBS=$(find netplay-deps/libdatachannel/build -name "*.a" | sort -u)
          windres icon.rc -O coff -o icon.res
          g++ -O2 -std=c++11 -D_USE_MATH_DEFINES -DFREEGLUT_STATIC -DSTEAM_BUILD \
            -DNEWTONIA_VERSION_STRING=\"$NEWTONIA_VERSION\" \
            -DNEWTONIA_NET_RTC -DRTC_STATIC \
            -Inetplay-deps/libdatachannel/include \
            $(pkg-config --cflags sdl2 SDL2_mixer freeglut) \
            -I./sdk/public \
            -o newtonia.exe $SRCS icon.res \
            -static \
            $(pkg-config --libs --static sdl2 SDL2_mixer freeglut) \
            -Wl,--start-group $NETLIBS -Wl,--end-group \
            -lssl -lcrypto -lws2_32 -liphlpapi -lbcrypt -lcrypt32 \
            -lopengl32 -lglu32 \
            -L. -lsteam_api64

      - name: Netplay loopback self-test
        run: |
          NEWTONIA_NET_SELFTEST=1 SDL_AUDIODRIVER=dummy ./newtonia.exe | tee selftest.log
          grep -q "NET SELFTEST PASS" selftest.log

      - name: Stage depot
        shell: bash
        run: |
          mkdir -p steam_output/windows
          cp newtonia.exe steam_output/windows/
          cp steam_api64.dll steam_output/windows/
          cp -r audio steam_output/windows/
          # Steam Input action manifest + the exported default layouts,
          # beside the binary (STEAMINPUT.md §2): the portal names each
          # layout by its path relative to the install dir, i.e. bare.
          cp steam/game_actions_4536720.vdf steam_output/windows/
          for f in steam/controller_*.vdf; do [ -e "$f" ] && cp "$f" steam_output/windows/; done; true

      - uses: actions/upload-artifact@v4
        with:
          name: steam-windows
          path: steam_output/windows/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Season stamp (SEASON file, tag builds only)
        if: github.ref_type == 'tag'
        run: echo "NEWTONIA_VERSION=$(tr -d '[:space:]' < SEASON)" >> "$GITHUB_ENV"

      # Network fetches retry with backoff — one transient GitHub/CDN 503
      # wave took out four workflow runs at once (2026-08-03; the macOS Dev
      # twin of the x86_64 Homebrew step was among them).
      - name: Install arm64 dependencies
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20)); done; }
          try brew install sdl2 mpg123

      - name: Install x86_64 Homebrew and dependencies
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20)); done; }
          install_x86_brew() {
            arch -x86_64 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          }
          try install_x86_brew
          try arch -x86_64 /usr/local/bin/brew install sdl2 mpg123

      - name: Build SDL2_mixer from source (WAV + MP3 only)
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20)); done; }
          SDL_MIXER_VER=2.8.2
          fetch() { curl -fsSL https://github.com/libsdl-org/SDL_mixer/releases/download/release-${SDL_MIXER_VER}/SDL2_mixer-${SDL_MIXER_VER}.tar.gz | tar xz; }
          try fetch
          cd SDL2_mixer-${SDL_MIXER_VER}

          cmake_flags=(
            -DCMAKE_BUILD_TYPE=Release
            -DSDL2MIXER_VENDORED=OFF
            -DSDL2MIXER_SAMPLES=OFF
            -DSDL2MIXER_OGG=OFF
            -DSDL2MIXER_FLAC=OFF
            -DSDL2MIXER_MIDI=OFF
            -DSDL2MIXER_OPUS=OFF
            -DSDL2MIXER_MOD=OFF
            -DSDL2MIXER_WAVPACK=OFF
            -DSDL2MIXER_MP3=ON
            -DSDL2MIXER_MP3_MPG123=ON
            -DSDL2MIXER_WAVE=ON
          )

          cmake -B build-arm64 "${cmake_flags[@]}" \
            -DCMAKE_PREFIX_PATH=/opt/homebrew \
            -DCMAKE_INSTALL_PREFIX=/opt/homebrew
          cmake --build build-arm64 -j$(sysctl -n hw.logicalcpu)
          install_name_tool -id /opt/homebrew/lib/libSDL2_mixer.dylib \
            build-arm64/libSDL2_mixer.dylib
          cp build-arm64/libSDL2_mixer.dylib /opt/homebrew/lib/libSDL2_mixer.dylib

          cmake -B build-x86 "${cmake_flags[@]}" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_C_FLAGS="-target x86_64-apple-macos12.0" \
            -DCMAKE_CXX_FLAGS="-target x86_64-apple-macos12.0" \
            -DCMAKE_SHARED_LINKER_FLAGS="-target x86_64-apple-macos12.0" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build-x86 -j$(sysctl -n hw.logicalcpu)
          install_name_tool -id /usr/local/lib/libSDL2_mixer.dylib \
            build-x86/libSDL2_mixer.dylib
          cp build-x86/libSDL2_mixer.dylib /usr/local/lib/libSDL2_mixer.dylib

          cp include/SDL_mixer.h /opt/homebrew/include/SDL2/SDL_mixer.h
          cp include/SDL_mixer.h /usr/local/include/SDL2/SDL_mixer.h

      - name: Download Steamworks SDK
        env:
          GH_TOKEN: ${{ secrets.STEAM_SDK_TOKEN }}
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20)); done; }
          fetch_sdk() {
            ASSET_URL=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/cradle/assets/releases/tags/sdk-latest" \
              | python3 -c "import sys,json;data=json.load(sys.stdin);print(next(a['url'] for a in data['assets'] if a['name']=='steamworks_sdk.zip'))") &&
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$ASSET_URL" -o steamworks_sdk.zip
          }
          try fetch_sdk
          unzip -q steamworks_sdk.zip
          # Set the install name so the linker embeds the correct Frameworks path
          install_name_tool -id \
            "@executable_path/../Frameworks/libsteam_api.dylib" \
            sdk/redistributable_bin/osx/libsteam_api.dylib

      # Netplay (NETPLAY.md): universal (fat) libdatachannel — the same
      # recipe macos-dev.yml gates on every push. MbedTLS-based so both
      # architectures come out of one build; installs into ./netplay-libs
      # (headers + libs only — the source clone lives in a temp dir).
      - name: Build libdatachannel (netplay, universal)
        run: ./build_netplay_deps.sh --universal

      - name: Collect sources
        run: |
          find . -name "*.cpp" \
            -not -path "./android/*" \
            -not -path "./test/*" \
            -not -path "./.git/*" \
            -not -path "./sdk/*" > srcs.txt

      - name: Build arm64
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          clang++ -O2 -std=c++11 -arch arm64 \
            -mmacosx-version-min=12.0 \
            -DGL_SILENCE_DEPRECATION -DSTEAM_BUILD \
            -DNEWTONIA_VERSION_STRING=\"$NEWTONIA_VERSION\" \
            -DNEWTONIA_NET_RTC -I./netplay-libs/include \
            -I./sdk/public \
            -o newtonia-arm64 $(cat srcs.txt) macos_window.mm \
            $(/opt/homebrew/bin/sdl2-config --cflags --libs) \
            -L/opt/homebrew/lib -lSDL2_mixer \
            -I/opt/homebrew/include/SDL2 \
            -L./netplay-libs/lib -ldatachannel \
            -Wl,-rpath,@executable_path/../Frameworks \
            -Wl,-rpath,"$PWD/netplay-libs/lib" \
            -L./sdk/redistributable_bin/osx -lsteam_api \
            -framework GLUT -framework OpenGL -framework AppKit

      # In-process WebRTC loopback — runs before any window/GL is created,
      # resolving libdatachannel via the netplay-libs rpath. libsteam_api's
      # install name was rewritten to @executable_path/../Frameworks for the
      # bundle, so stage it there relative to the raw binary or dyld aborts
      # the launch before main().
      - name: Netplay loopback self-test (arm64)
        run: |
          mkdir -p ../Frameworks
          cp sdk/redistributable_bin/osx/libsteam_api.dylib ../Frameworks/
          NEWTONIA_NET_SELFTEST=1 SDL_AUDIODRIVER=dummy ./newtonia-arm64 | tee selftest.log
          grep -q "NET SELFTEST PASS" selftest.log

      - name: Build x86_64
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          clang++ -O2 -std=c++11 -arch x86_64 \
            -mmacosx-version-min=12.0 \
            -DGL_SILENCE_DEPRECATION -DSTEAM_BUILD \
            -DNEWTONIA_VERSION_STRING=\"$NEWTONIA_VERSION\" \
            -DNEWTONIA_NET_RTC -I./netplay-libs/include \
            -I./sdk/public \
            -o newtonia-x86_64 $(cat srcs.txt) macos_window.mm \
            $(/usr/local/bin/sdl2-config --cflags --libs) \
            -L/usr/local/lib -lSDL2_mixer \
            -I/usr/local/include/SDL2 \
            -L./netplay-libs/lib -ldatachannel \
            -Wl,-rpath,@executable_path/../Frameworks \
            -Wl,-rpath,"$PWD/netplay-libs/lib" \
            -L./sdk/redistributable_bin/osx -lsteam_api \
            -framework GLUT -framework OpenGL -framework AppKit

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          printf '%s' "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"' | xargs) /Library/Keychains/System.keychain
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" "$KEYCHAIN"

      - name: Create universal binary and bundle .app
        run: |
          lipo -create -output newtonia newtonia-arm64 newtonia-x86_64

          mkdir -p Newtonia.app/Contents/{MacOS,Frameworks,Resources}
          cp newtonia Newtonia.app/Contents/MacOS/newtonia
          cp icon.icns Newtonia.app/Contents/Resources/icon.icns
          cp -r audio Newtonia.app/Contents/Resources/audio
          # Steam Input action manifest INSIDE the bundle (SDL_GetBasePath is
          # Contents/Resources there — steam_input.cpp's own manifest path),
          # here before signing so it rides under the seal; the depot-root
          # copy for the portal's bundled-config setting is staged later.
          cp steam/game_actions_4536720.vdf Newtonia.app/Contents/Resources/

          FW="Newtonia.app/Contents/Frameworks"
          bundle() {
            local target="$1"
            while IFS= read -r dep; do
              local name dest arm x86
              name=$(basename "$dep")
              dest="$FW/$name"
              arm=$(echo "$dep" | sed 's|/usr/local/|/opt/homebrew/|g')
              x86=$(echo "$dep" | sed 's|/opt/homebrew/|/usr/local/|g')
              if [ ! -f "$dest" ]; then
                if [ "$arm" != "$x86" ] && [ -f "$arm" ] && [ -f "$x86" ]; then
                  lipo -create "$arm" "$x86" -output "$dest"
                elif [ -f "$dep" ]; then
                  cp "$dep" "$dest"
                elif [ -f "$arm" ]; then
                  cp "$arm" "$dest"
                elif [ -f "$x86" ]; then
                  cp "$x86" "$dest"
                else
                  echo "WARNING: $dep not found, skipping" >&2
                  continue
                fi
                install_name_tool -id "@executable_path/../Frameworks/$name" "$dest"
                bundle "$dest"
                codesign --sign "Developer ID Application" --force --timestamp \
                  --options runtime "$dest"
              fi
              install_name_tool -change "$arm" "@executable_path/../Frameworks/$name" "$target" 2>/dev/null || true
              install_name_tool -change "$x86" "@executable_path/../Frameworks/$name" "$target" 2>/dev/null || true
            done < <(
              { otool -arch arm64  -L "$target" 2>/dev/null
                otool -arch x86_64 -L "$target" 2>/dev/null; } \
              | awk '/^\t/{print $1}' \
              | grep -Ev '^(/usr/lib|/System|@)' \
              | sort -u
            )
          }

          bundle Newtonia.app/Contents/MacOS/newtonia

          # Bundle libsteam_api.dylib — it is already a universal binary and its
          # install name was set to @executable_path/../Frameworks/... before
          # linking, so the bundle() function skips it (@ prefix).  Copy and
          # sign it explicitly here.
          cp sdk/redistributable_bin/osx/libsteam_api.dylib "$FW/libsteam_api.dylib"
          codesign --sign "Developer ID Application" --force --timestamp \
            --options runtime "$FW/libsteam_api.dylib"

          # Bundle libdatachannel (netplay) — referenced as @rpath/... so the
          # bundle() walk skips it (@ prefix), same as libsteam_api. The
          # binary's @executable_path/../Frameworks rpath resolves it. Fat
          # dylib (MbedTLS statically absorbed), one file per install name.
          cp netplay-libs/lib/libdatachannel.*.dylib "$FW/"
          for f in "$FW"/libdatachannel*.dylib; do
            lipo -info "$f" | grep arm64 | grep -q x86_64
            codesign --sign "Developer ID Application" --force --timestamp \
              --options runtime "$f"
          done

          # Bundle libSDL3 — Homebrew's "sdl2" is now sdl2-compat, an SDL2 API
          # shim that loads SDL3 at runtime via dlopen and aborts if it can't
          # find it ("Failed loading SDL3 library").  Because that load is a
          # dlopen, not a linked dependency, the bundle() walk above never sees
          # SDL3, so copy it in explicitly.  sdl2-compat's first macOS search
          # candidate is @loader_path/libSDL3.dylib — i.e. next to libSDL2 in
          # Frameworks — so the file must be named exactly libSDL3.dylib.
          find_sdl3() {
            for n in libSDL3.0.dylib libSDL3.dylib; do
              if [ -f "$1/lib/$n" ]; then echo "$1/lib/$n"; return 0; fi
            done
            return 1
          }
          SDL3_ARM=$(find_sdl3 /opt/homebrew || true)
          SDL3_X86=$(find_sdl3 /usr/local   || true)
          if [ -n "$SDL3_ARM" ] && [ -n "$SDL3_X86" ]; then
            lipo -create "$SDL3_ARM" "$SDL3_X86" -output "$FW/libSDL3.dylib"
          elif [ -n "$SDL3_ARM" ]; then
            cp "$SDL3_ARM" "$FW/libSDL3.dylib"
          elif [ -n "$SDL3_X86" ]; then
            cp "$SDL3_X86" "$FW/libSDL3.dylib"
          else
            echo "ERROR: libSDL3 not found in Homebrew prefixes" >&2
            exit 1
          fi
          install_name_tool -id "@loader_path/libSDL3.dylib" "$FW/libSDL3.dylib"
          # Pull in any non-system libraries SDL3 itself links, then sign it
          # with the same identity so library validation accepts the dlopen.
          bundle "$FW/libSDL3.dylib"
          codesign --sign "Developer ID Application" --force --timestamp \
            --options runtime "$FW/libSDL3.dylib"

          codesign --sign "Developer ID Application" --force --timestamp \
            --options runtime \
            --entitlements macos/EntitlementsDevID.plist \
            Newtonia.app/Contents/MacOS/newtonia

          cat > Newtonia.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>     <string>newtonia</string>
            <key>CFBundleIdentifier</key>     <string>com.newtonia.app</string>
            <key>CFBundleName</key>           <string>Newtonia</string>
            <key>CFBundleIconFile</key>       <string>icon</string>
            <key>CFBundleVersion</key>        <string>1.0</string>
            <key>CFBundlePackageType</key>    <string>APPL</string>
            <key>LSMinimumSystemVersion</key> <string>12.0</string>
            <key>LSApplicationCategoryType</key> <string>public.app-category.games</string>
          </dict>
          </plist>
          PLIST

      - name: Sign .app bundle
        run: |
          codesign --sign "Developer ID Application" --force --timestamp \
            --options runtime \
            --entitlements macos/EntitlementsDevID.plist \
            Newtonia.app

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
        run: |
          ditto -c -k --keepParent Newtonia.app newtonia-steam-macos.zip
          xcrun notarytool submit newtonia-steam-macos.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple Newtonia.app

      - name: Stage depot
        run: |
          mkdir -p steam_output/macos
          cp -r Newtonia.app steam_output/macos/
          # Steam Input action manifest + exported default layouts at the
          # depot root (STEAMINPUT.md §2) for the portal's bundled-config
          # paths; the in-bundle manifest copy was sealed with the app above.
          cp steam/game_actions_4536720.vdf steam_output/macos/
          for f in steam/controller_*.vdf; do [ -e "$f" ] && cp "$f" steam_output/macos/; done; true

      - uses: actions/upload-artifact@v4
        with:
          name: steam-macos
          path: steam_output/macos/

  build-linux:
    runs-on: ubuntu-22.04
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Season stamp (SEASON file, tag builds only)
        if: github.ref_type == 'tag'
        run: echo "NEWTONIA_VERSION=$(tr -d '[:space:]' < SEASON)" >> "$GITHUB_ENV"

      # Network fetches retry with backoff — one transient GitHub/CDN 503
      # wave took out four workflow runs at once (2026-08-03; this job's
      # SDL clone was among them).
      - name: Install dependencies
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20)); done; }
          try apt-get update
          try apt-get install -y \
            freeglut3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libssl-dev \
            libxi-dev \
            cmake \
            libudev-dev \
            libasound2-dev \
            libpulse-dev \
            unzip

      - name: Download Steamworks SDK
        env:
          GH_TOKEN: ${{ secrets.STEAM_SDK_TOKEN }}
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20)); done; }
          fetch_sdk() {
            ASSET_URL=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/cradle/assets/releases/tags/sdk-latest" \
              | python3 -c "import sys,json;data=json.load(sys.stdin);print(next(a['url'] for a in data['assets'] if a['name']=='steamworks_sdk.zip'))") &&
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$ASSET_URL" -o steamworks_sdk.zip
          }
          try fetch_sdk
          unzip -q steamworks_sdk.zip

      - name: Build SDL2 from source
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          CLEAN=SDL2_source try git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git SDL2_source
          cmake -S SDL2_source -B SDL2_source/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF
          cmake --build SDL2_source/build --parallel
          cmake --install SDL2_source/build

      - name: Build SDL2_mixer (WAV + MP3 only)
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          CLEAN=SDL2_mixer try git clone --depth 1 --branch release-2.8.2 https://github.com/libsdl-org/SDL_mixer.git SDL2_mixer
          cmake -S SDL2_mixer -B SDL2_mixer/build \
            -DSDL2MIXER_WAV=ON \
            -DSDL2MIXER_MP3=ON \
            -DSDL2MIXER_FLAC=OFF \
            -DSDL2MIXER_VORBIS=OFF \
            -DSDL2MIXER_OPUS=OFF \
            -DSDL2MIXER_MOD=OFF \
            -DSDL2MIXER_MIDI=OFF \
            -DSDL2MIXER_WAVPACK=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DSDL2MIXER_SAMPLES=OFF
          cmake --build SDL2_mixer/build --parallel
          cmake --install SDL2_mixer/build

      # Netplay (NETPLAY.md): libdatachannel from source, built INSIDE the
      # steamrt container so it links the runtime's own OpenSSL. Installs
      # into ./netplay-libs (headers + libs only; source clone is in a temp
      # dir, so the source find below stays clean).
      - name: Build libdatachannel (netplay)
        run: ./build_netplay_deps.sh

      - name: Build
        run: |
          SRCS=$(find . -name "*.cpp" \
            -not -path "./android/*" \
            -not -path "./test/*" \
            -not -path "./.git/*" \
            -not -path "./sdk/*" \
            -not -path "./SDL2_source/*" \
            -not -path "./SDL2_mixer/*")
          g++ -O2 -Wall -std=c++11 \
            -DSTEAM_BUILD \
            -DNEWTONIA_VERSION_STRING=\"$NEWTONIA_VERSION\" \
            -DNEWTONIA_NET_RTC -I./netplay-libs/include \
            $(sdl2-config --cflags) -I/usr/local/include/SDL2 \
            -I./sdk/public \
            -o newtonia $SRCS \
            -lglut -lGL -lGLU \
            -lSDL2_mixer $(sdl2-config --static-libs) \
            -L./netplay-libs/lib -ldatachannel \
            -L./sdk/redistributable_bin/linux64 -lsteam_api \
            -Wl,-rpath,'$ORIGIN' -Wl,-rpath,"$PWD/netplay-libs/lib" \
            -lX11 -lXi

      # In-process WebRTC loopback — runs before any window/GL is created,
      # so it works headless inside the container. libsteam_api.so resolves
      # via the $ORIGIN rpath (depot layout), so put it next to the binary
      # or the loader fails before main().
      - name: Netplay loopback self-test
        run: |
          cp sdk/redistributable_bin/linux64/libsteam_api.so .
          NEWTONIA_NET_SELFTEST=1 SDL_AUDIODRIVER=dummy ./newtonia | tee selftest.log
          grep -q "NET SELFTEST PASS" selftest.log

      - name: Stage depot
        run: |
          mkdir -p steam_output/linux
          cp newtonia steam_output/linux/
          cp sdk/redistributable_bin/linux64/libsteam_api.so steam_output/linux/
          # Ship libdatachannel under the exact SONAME the binary asks for;
          # the $ORIGIN rpath finds it next to the executable.
          soname=$(objdump -p newtonia | awk '/NEEDED.*datachannel/{print $2}')
          cp -L "netplay-libs/lib/$soname" steam_output/linux/
          cp -r audio steam_output/linux/
          # Steam Input action manifest + the exported default layouts,
          # beside the binary (STEAMINPUT.md §2)
          cp steam/game_actions_4536720.vdf steam_output/linux/
          for f in steam/controller_*.vdf; do [ -e "$f" ] && cp "$f" steam_output/linux/; done; true

      - uses: actions/upload-artifact@v4
        with:
          name: steam-linux
          path: steam_output/linux/

  deploy-steam:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: steam-windows
          path: steam_output/windows/

      - uses: actions/download-artifact@v4
        with:
          name: steam-macos
          path: steam_output/macos/

      - uses: actions/download-artifact@v4
        with:
          name: steam-linux
          path: steam_output/linux/

      - name: Deploy to Steam
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ secrets.STEAM_APP_ID }}
          buildDescription: ${{ github.ref_name || github.sha }}
          rootPath: steam_output
          depot1Path: windows
          depot2Path: macos
          depot3Path: linux
          releaseBranch: ${{ github.event.inputs.branch || 'beta' }}
