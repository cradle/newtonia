name: Xbox Console Smoke

# Compile-only smoke test of the game against the Xbox CONSOLE API partition,
# on a stock hosted runner — no NDA material required.
#
# The real console toolchain (GDKX: Scarlett MSBuild platform, D3D12.X,
# console libs) is only available to licensed ID@Xbox partners, so hosted
# runners cannot do a true Gaming.Xbox.Scarlett.x64 build (see
# xbox/PORT_PLAN.md Phase 5). What a hosted runner CAN do — the same trick
# vcpkg's community Xbox triplets use — is compile against the Xbox Game OS
# API partition with plain MSVC + Windows SDK (>= 22000):
#
#   /DWINAPI_FAMILY=WINAPI_FAMILY_GAMES
#
# That partition excludes GDI, D3D11, desktop OpenGL/WGL, and other
# desktop-only Win32 APIs, so this job catches forbidden-API usage at compile
# time before it reaches a dev kit.
#
# Which renderer is compiled, and why _GAMING_DESKTOP (not _GAMING_XBOX):
# ---------------------------------------------------------------------
# The console's decided rendering path is Option A — GLon12 (Mesa
# OpenGL-on-D3D12) driving the existing desktop GL 3.3 core renderer
# (DESKTOP_COMPAT_GL), NOT GLES2-over-ANGLE. ANGLE was the old _GAMING_XBOX
# placeholder and is being abandoned (xbox/PORT_PLAN.md §1, Option A). So this
# smoke defines _GAMING_DESKTOP — which selects exactly that desktop-GL/GLon12
# renderer — and compiles it under WINAPI_FAMILY_GAMES. The result: the
# renderer + shared game code we actually intend to ship on console are checked
# for console-API cleanliness on every PR, GDKX-free.
#
# This INTENTIONALLY no longer compiles the ANGLE flow: the EGL/GLES2 renderer
# path, the manual EGL context, and the GDK PLM block in xbox_main.cpp are all
# #ifdef _GAMING_XBOX and are not built here. They are an abandoned fallback and
# will be reworked under GDKX (xbox/PORT_PLAN.md work-items #4/#5); the stubbed
# GDK headers under xbox/smoke_stubs/ go unused while that path is dormant.
#
# What this does NOT cover: the console entry point's windowing/present
# specifics (real surface creation, PLM, XUser) are _GAMING_XBOX + GDKX-gated
# and rewritten in Phase 3/4 — not this job's concern. This is a compile-only
# API-surface check (a direct `cl @smoke.rsp`, no link step — the console
# import libraries are GDKX-only), not the real Scarlett build (Ninja + GDKX on
# a self-hosted runner; see .github/workflows/disabled/deploy-xbox.yml). The
# shipping Desktop/GLon12 build vehicle is the self-hosted xbox.yml.

on:
  # Mirror xbox.yml: feature branches build via their PR only; push limited to
  # the mainline so merges still build without double-running open-PR branches.
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: xbox-console-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL2_VERSION: 2.30.9
  SDL2_MIXER_VERSION: 2.8.0

jobs:
  compile-smoke:
    runs-on: windows-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      # Prebuilt VC development packages are used for their HEADERS only
      # (compile-only job; SDL itself is not built and nothing is linked).
      - name: Fetch SDL2 + SDL2_mixer headers
        shell: pwsh
        run: |
          curl -sSfL -o sdl2.zip "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-VC.zip"
          curl -sSfL -o mixer.zip "https://github.com/libsdl-org/SDL_mixer/releases/download/release-$env:SDL2_MIXER_VERSION/SDL2_mixer-devel-$env:SDL2_MIXER_VERSION-VC.zip"
          Expand-Archive sdl2.zip  -DestinationPath "$env:RUNNER_TEMP\sdl"
          Expand-Archive mixer.zip -DestinationPath "$env:RUNNER_TEMP\sdl"
          $sdlInc   = "$env:RUNNER_TEMP\sdl\SDL2-$env:SDL2_VERSION\include"
          $mixerInc = "$env:RUNNER_TEMP\sdl\SDL2_mixer-$env:SDL2_MIXER_VERSION\include"
          if (-not (Test-Path "$sdlInc\SDL.h"))         { Write-Error "SDL.h not found at $sdlInc"; exit 1 }
          if (-not (Test-Path "$mixerInc\SDL_mixer.h")) { Write-Error "SDL_mixer.h not found at $mixerInc"; exit 1 }
          echo "SDL_INC=$sdlInc"     >> $env:GITHUB_ENV
          echo "MIXER_INC=$mixerInc" >> $env:GITHUB_ENV

      # Same source set as xbox/CMakeLists.txt: root + weapon/ + view/ minus
      # other platforms' entry points, plus the SDL GDK stubs. The desktop-GL
      # renderer path needs no EGL/ANGLE headers (those are _GAMING_XBOX-only).
      - name: Write compiler response file
        shell: pwsh
        run: |
          $srcs = @()
          $srcs += Get-ChildItem -Path . -Filter *.cpp -File |
                     Where-Object { $_.Name -notin @('glut.cpp','android_main.cpp','web_main.cpp') }
          $srcs += Get-ChildItem -Path weapon -Filter *.cpp -File
          $srcs += Get-ChildItem -Path view   -Filter *.cpp -File
          $srcs += Get-Item xbox\sdl_gdk_stubs.cpp

          New-Item -ItemType Directory -Force -Path smoke_obj | Out-Null

          $lines = @(
            '/c', '/nologo', '/MP', '/W3', '/EHsc', '/std:c++14',
            '/DWINAPI_FAMILY=WINAPI_FAMILY_GAMES',
            '/D_GAMING_DESKTOP',      # selects the desktop-GL/GLon12 renderer (DESKTOP_COMPAT_GL), not ANGLE/GLES2
            '/D_USE_MATH_DEFINES',
            '/D_CRT_SECURE_NO_WARNINGS',
            '/wd4005',                # M_PI redefinition (SDL_stdinc vs CRT), as in xbox/CMakeLists.txt
            '/I.', '/Iweapon', '/Iview',
            "/I$env:SDL_INC",
            "/I$env:MIXER_INC",
            '/Fosmoke_obj\'
          )
          $lines += $srcs | ForEach-Object { $_.FullName }
          $lines | Set-Content -Path smoke.rsp -Encoding ascii
          Write-Host "Compiling $($srcs.Count) sources:"
          Get-Content smoke.rsp

      - name: Compile (WINAPI_FAMILY_GAMES + _GAMING_DESKTOP)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR (echo vswhere found no Visual Studio & exit /b 1)
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          cl @smoke.rsp
