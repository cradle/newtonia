name: Xbox GDK Desktop

# Builds the Gaming.Desktop.x64 code path as a canary for the Xbox port — no
# Xbox hardware required — using the Ninja generator + MSVC with a BWOI (Build
# WithOut Installing) GDK.
#
# Why Ninja (not -A Gaming.Desktop.x64): the VS generator must discover
# VCTargetsPath via an internally generated probe project that loads the GDK
# MSBuild platform's WindowsSDK check. Under BWOI there is no SDK registry
# entry, so that probe is unsolvable on hosted runners (MSB8037). Ninja invokes
# cl.exe directly — no MSBuild platform, no VCTargets, no probe.
#
# The GDK is still fully set up: it's extracted from the public release ZIP
# with lessmsi (no installer, no winget, no msiexec hang, no GamingServices
# Appx step), its headers are put on the compile include path, and
# _GAMING_DESKTOP is defined. So this compiles the real GDK Desktop code and is
# the basis for the console (Scarlett) target — same structure, swap to the
# xbox/ tree + _GAMING_XBOX + console libs.

on:
  push:
    branches: [master, main, 'claude/**']
  pull_request:
  workflow_dispatch:

# Auto-cancel a superseded in-progress run on the same ref.
concurrency:
  group: xbox-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # windows-2022: its MSVC toolset (v143) matches the GDK's libs exactly.
    # Now that the build is Ninja-based (no GDK MSBuild platform), windows-latest
    # would also work — switch when windows-2022 is retired.
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Extract GDK (BWOI)
        shell: pwsh
        run: |
          # Download the public GDK release ZIP and extract its MSIs' files with
          # lessmsi (reads MSI tables + cabs directly — no msiexec, so no
          # installer, no winget, no GamingServices Appx step, no 30-min
          # administrative-extract hang). Pinned to GDK 2604.2.7849; bump in
          # lockstep with the winget manifest hash.
          $ErrorActionPreference = "Stop"
          function ts($m) { Write-Host "[$(Get-Date -Format HH:mm:ss)] $m" }
          $ver = "2604.2.7849"
          $ed  = "260402"
          $url = "https://github.com/microsoft/GDK/releases/download/April-2026-Update-2-v$ver/GDK_$ver.zip"
          $sha = "DCF28E26EBF442E16FFF05AB869E37534ABD85111C8BFD22401905D647688ADB"
          $zip = "$env:RUNNER_TEMP\gdk.zip"
          ts "downloading $url"
          & curl.exe -sSfL -o $zip $url
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $sha) {
            Write-Error "GDK zip SHA256 mismatch"; exit 1
          }
          $src = "$env:RUNNER_TEMP\gdksrc"
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          ts "extracting zip with tar"
          & tar.exe -xf $zip -C $src
          if ($LASTEXITCODE -ne 0) { Write-Error "tar extract failed"; exit 1 }
          $installers = Join-Path $src "Installers"

          ts "installing lessmsi (chocolatey, preinstalled on the runner)"
          & choco install lessmsi -y --no-progress --no-color | Out-Null
          $lessmsi = "C:\ProgramData\chocolatey\bin\lessmsi.exe"
          if (-not (Test-Path $lessmsi)) {
            $lessmsi = (Get-Command lessmsi -ErrorAction SilentlyContinue).Source
          }
          if (-not $lessmsi) { Write-Error "lessmsi not found after choco install"; exit 1 }

          # Only the gameKit headers are needed for the Ninja build; they live in
          # the "PC Development" MSI. Extract it (skip the rest for speed).
          $extracted = "C:\gdkx"
          New-Item -ItemType Directory -Force -Path $extracted | Out-Null
          Get-ChildItem $installers -Filter "PC Dev*.msi" | ForEach-Object {
            ts "lessmsi x $($_.Name)"
            & $lessmsi x $_.FullName "$extracted\"
            if ($LASTEXITCODE -ne 0) { Write-Error "lessmsi failed for $($_.Name)"; exit 1 }
          }
          ts "extraction done"

          # lessmsi nests the tree under a SourceDir folder; locate the gameKit
          # include dir wherever it landed (…/Microsoft GDK/<ed>/windows/include).
          $inc = Get-ChildItem $extracted -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\Microsoft GDK\$ed\windows\include" } |
            Select-Object -First 1
          if (-not $inc) {
            Write-Error "GDK gameKit include dir not found after extraction"
            Get-ChildItem $extracted -Recurse -Directory -Depth 4 -ErrorAction SilentlyContinue |
              Select-Object FullName | Format-Table -AutoSize
            exit 1
          }
          Write-Host "GDK include dir: $($inc.FullName)"
          echo "GDK_INCLUDE_DIR=$($inc.FullName)" >> $env:GITHUB_ENV

      - name: Locate ANGLE
        shell: pwsh
        run: |
          # ANGLE (libEGL / libGLESv2) — GLES2 -> D3D11 translation layer for our
          # renderer. From the ANGLE.WindowsStore NuGet package (import libs,
          # headers, and redistributable DLLs).
          nuget install ANGLE.WindowsStore -ExcludeVersion `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" -NonInteractive
          $pkg = "$env:RUNNER_TEMP\nuget\ANGLE.WindowsStore"
          $lib = Get-ChildItem $pkg -Recurse -Filter "libEGL.lib" |
                   Where-Object FullName -match 'x64' | Select-Object -First 1
          if (-not $lib) { Write-Error "libEGL.lib not found in ANGLE.WindowsStore"; exit 1 }
          $hdr = Get-ChildItem $pkg -Recurse -Filter "egl.h" | Select-Object -First 1
          if (-not $hdr) { Write-Error "egl.h not found in ANGLE.WindowsStore"; exit 1 }
          $angleInclude = $hdr.Directory.Parent.FullName
          $dll = Get-ChildItem $pkg -Recurse -Filter "libEGL.dll" |
                   Where-Object FullName -match 'x64' | Select-Object -First 1
          if (-not $dll) { Write-Error "libEGL.dll not found in ANGLE.WindowsStore"; exit 1 }
          echo "ANGLE_LIB_DIR=$($lib.Directory.FullName)"     >> $env:GITHUB_ENV
          echo "ANGLE_INCLUDE_DIR=$angleInclude"              >> $env:GITHUB_ENV
          echo "ANGLE_BIN_DIR=$($dll.Directory.FullName)"     >> $env:GITHUB_ENV

      - name: Configure + Build (Ninja)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR (echo vswhere found no Visual Studio & exit /b 1)
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          rem Ensure Ninja is on PATH (VS ships it; also preinstalled on the runner).
          set "PATH=%VSDIR%\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja;%PATH%"
          cmake -G Ninja -B xbox\build-desktop -S xbox ^
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGDK_INCLUDE_DIR="%GDK_INCLUDE_DIR%" ^
            -DANGLE_LIB_DIR="%ANGLE_LIB_DIR%" ^
            -DANGLE_INCLUDE_DIR="%ANGLE_INCLUDE_DIR%" || exit /b 1
          cmake --build xbox\build-desktop || exit /b 1

      - name: Stage DLLs
        shell: pwsh
        run: |
          # Ninja is single-config: the exe + post-build audio land directly in
          # build-desktop/. Static CRT (/MT) means only the ANGLE DLLs are needed.
          $out = "xbox/build-desktop"
          Copy-Item "$env:ANGLE_BIN_DIR\libEGL.dll"    $out
          Copy-Item "$env:ANGLE_BIN_DIR\libGLESv2.dll" $out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: newtonia-gdk-desktop
          path: |
            xbox/build-desktop/newtonia.exe
            xbox/build-desktop/libEGL.dll
            xbox/build-desktop/libGLESv2.dll
            xbox/build-desktop/audio/
          retention-days: 7
