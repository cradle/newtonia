name: Web / GitHub Pages

# Branch pushes compile-gate the web build (the only emcc gate — dev
# containers have no emsdk); only master/main deploy to GitHub Pages.
on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one run per ref at a time; branch builds must not share (and
# cancel) the master deploy's concurrency group.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 for the tags: the Makefile stamps `git describe` into
      # every replay header (REPLAY.md R4 — leaderboard seasons bucket by
      # release), and this workflow deploys the PUBLIC Pages build, so it
      # should say which release it is ahead of rather than "dev".
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node (for tsc)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Network fetches retry with backoff, wiping partial state between
      # attempts — one transient GitHub 503 wave took out four workflow
      # runs at once (2026-08-03).
      - name: Install TypeScript
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20)); done; }
          try npm install -g typescript

      - name: Compile TypeScript UI
        working-directory: web
        run: tsc

      - name: Install Emscripten SDK
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          fetch() {
            git clone https://github.com/emscripten-core/emsdk.git ~/emsdk &&
            ~/emsdk/emsdk install latest &&
            ~/emsdk/emsdk activate latest
          }
          CLEAN=$HOME/emsdk try fetch

      - name: Build WebAssembly
        run: |
          source ~/emsdk/emsdk_env.sh
          emcc --version   # triggers sanity checks + sysroot initialisation
          # The free public site (GitHub Pages) ships with netplay
          # force-disabled permanently (NEWTONIA_NET_DISABLED — pricing
          # decision in NETPLAY.md: paid on Steam/iOS, so free browser
          # co-op would undercut them). Browser co-op was to live on the
          # paid newtonia-online itch project, which deploy-itch still
          # builds netplay-ON — but that project is unpublished and
          # parked (itch cannot purchase-gate HTML5 embeds, NETPLAY.md
          # Gate 5). The netless default here is unaffected either way.
          make web NETPLAY=0

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
