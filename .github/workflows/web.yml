name: Web / GitHub Pages

# Branch pushes compile-gate the web build (the only emcc gate — dev
# containers have no emsdk); only master/main deploy to GitHub Pages.
on:
  push:
    branches: [master, main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one run per ref at a time; branch builds must not share (and
# cancel) the master deploy's concurrency group.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node (for tsc)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install TypeScript
        run: npm install -g typescript

      - name: Compile TypeScript UI
        working-directory: web
        run: tsc

      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install latest
          ~/emsdk/emsdk activate latest

      - name: Build WebAssembly
        run: |
          source ~/emsdk/emsdk_env.sh
          emcc --version   # triggers sanity checks + sysroot initialisation
          # The free public site (GitHub Pages) ships with netplay
          # force-disabled permanently (NEWTONIA_NET_DISABLED — pricing
          # decision in NETPLAY.md: paid on Steam/iOS, browser co-op is
          # the paid newtonia-online itch project, which deploy-itch
          # builds netplay-ON).
          make web NETPLAY=0

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
