name: Android APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: newtonia

      # Network fetches retry with backoff, wiping partial state between
      # attempts — one transient GitHub 503 wave took out four workflow
      # runs at once (2026-08-03).
      - name: Clone SDL2
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          CLEAN=SDL2 try git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git SDL2

      - name: Clone SDL2_mixer
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          fetch() {
            git clone --depth 1 --branch release-2.8.2 https://github.com/libsdl-org/SDL_mixer.git SDL2_mixer &&
            git -C SDL2_mixer submodule update --init --depth 1
          }
          CLEAN=SDL2_mixer try fetch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        # sdkmanager occasionally fetches a corrupt archive ("Error on ZipFile
        # unknown archive") and aborts; retry a few times so a flaky download
        # doesn't fail the whole build.
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"; then
              exit 0
            fi
            echo "sdkmanager failed (attempt $attempt), retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Copy audio assets
        run: mkdir -p newtonia/android/app/src/main/assets && cp -r newtonia/audio newtonia/android/app/src/main/assets/

      # CMake's FetchContent clones libdatachannel inside this step, so the
      # retry wipes the native build dir to unwedge a partial fetch.
      - name: Build debug APK
        working-directory: newtonia/android
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          CLEAN=app/.cxx try ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: newtonia-debug
          path: newtonia/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # The Android half of the per-platform TLS trust gate (TESTING.md). Every
  # other platform's relay round trip is CI-gated — macos-dev and windows run
  # the same NEWTONIA_SIGNAL_SELFTEST — and Android's was the one still
  # verified by hand on a phone, because it needs a device to run on. An
  # emulator is a device.
  #
  # What it proves is specific to this platform: MbedTLS reaches no system
  # trust store, so a completed WSS handshake to the production worker is the
  # proof that the roots baked into net_ca_bundle.cpp wrote to the pref path,
  # parsed, and verified Cloudflare's chain. Nothing else on Android checks
  # that.
  emulator-selftest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # /dev/kvm exists on ubuntu-latest but is root-only, and the emulator
      # is unusably slow (or refuses to boot) without it. This udev rule is
      # the documented fix for android-emulator-runner on GitHub-hosted
      # Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout
        uses: actions/checkout@v6

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: newtonia-debug

      # A plain image, not google_apis: the hook returns from SDL_main long
      # before Achievements::init() brings up the Play Games SDK, so nothing
      # here needs Google Play services. x86_64 because that is what the
      # runner can accelerate — the APK ships it alongside the two ARM ABIs
      # (android/app/build.gradle abiFilters).
      - name: Signal selftest on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash android/emulator_selftest.sh
        env:
          APK: app-debug.apk

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-selftest-log
          path: logcat-*.txt
          retention-days: 7
          if-no-files-found: ignore
