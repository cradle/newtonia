name: Android APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: newtonia

      # Network fetches retry with backoff, wiping partial state between
      # attempts — one transient GitHub 503 wave took out four workflow
      # runs at once (2026-08-03).
      - name: Clone SDL2
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          CLEAN=SDL2 try git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git SDL2

      - name: Clone SDL2_mixer
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          fetch() {
            git clone --depth 1 --branch release-2.8.2 https://github.com/libsdl-org/SDL_mixer.git SDL2_mixer &&
            git -C SDL2_mixer submodule update --init --depth 1
          }
          CLEAN=SDL2_mixer try fetch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        # sdkmanager occasionally fetches a corrupt archive ("Error on ZipFile
        # unknown archive") and aborts; retry a few times so a flaky download
        # doesn't fail the whole build.
        run: |
          for attempt in 1 2 3; do
            if sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"; then
              exit 0
            fi
            echo "sdkmanager failed (attempt $attempt), retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Copy audio assets
        run: mkdir -p newtonia/android/app/src/main/assets && cp -r newtonia/audio newtonia/android/app/src/main/assets/

      # CMake's FetchContent clones libdatachannel inside this step, so the
      # retry wipes the native build dir to unwedge a partial fetch.
      - name: Build debug APK
        working-directory: newtonia/android
        run: |
          try() { local i; for i in 1 2 3; do
                    if "$@"; then return 0; fi
                    if [ "$i" = 3 ]; then return 1; fi
                    echo "attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
                    if [ -n "${CLEAN:-}" ]; then rm -rf $CLEAN; fi; done; }
          CLEAN=app/.cxx try ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: newtonia-debug
          path: newtonia/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
